                  <div className="flex-between">
                    <div style={{flex:1,minWidth:0}}>
                      <div style={{fontWeight:700,fontSize:13}}>{p.name} <span className="badge badge-blue">{p.id}</span></div>
                      <div style={{fontSize:11,color:'var(--muted)'}}>@{p.username||'sem usuário'} {p.email&&'· '+p.email}</div>
                      <div style={{fontSize:11,color:'var(--muted)'}}>Senha: <span style={{color:'var(--yellow)'}}>{p.password||'—'}</span></div>
                      <div className="link-box" onClick={()=>navigator.clipboard.writeText(`${baseUrl}?player=${p.id}`)}>
                        {baseUrl}?player={p.id}
                      </div>
                    </div>
                    <button className="btn btn-danger btn-sm" style={{flexShrink:0,marginLeft:8}} onClick={()=>removePlayer(p.id)}>Remover</button>
                  </div>
                </div>
              ))
            )}
          </div>
        </div>
      )}

      {tab==='results'&&(
        <div>
          <div className="alert alert-info">Insira os placares reais para calcular pontuações.</div>
          <div className="scrollable">
            {GROUPS.map(g=>{
              const games=GROUP_GAMES.filter(gm=>gm.group===g);
              return(
                <div key={g} style={{marginBottom:'1rem'}}>
                  <div className="group-header"><h2 style={{fontSize:'.85rem'}}>{g==='LIB'?'🏆 Libertadores (Teste)':g==='SUL'?'🏆 Sul-Americana (Teste)':`Grupo ${g}`}</h2></div>
                  {games.map(gm=>{
                    const res=state.results?.[gm.id]||{};
                    return(
                      <div key={gm.id} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:9,padding:'.55rem .75rem',marginBottom:5}}>
                        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'.3rem'}}>
                          <span style={{fontFamily:"'Bebas Neue'",fontSize:'.8rem',color:'var(--muted)'}}>#{gm.id} · {gm.date?gm.date.slice(8)+'/'+gm.date.slice(5,7):''} {gm.time}</span>
                        </div>
                        <div style={{display:'flex',alignItems:'center',gap:6}}>
                          <span style={{fontWeight:600,fontSize:12,flex:1,textAlign:'right',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{gm.home}</span>
                          <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
                            <ScoreInput value={res.home??''} onChange={v=>updateResult(gm.id,'home',v)}/>
                            <span style={{color:'var(--muted)',fontSize:10,fontWeight:700}}>×</span>
                            <ScoreInput value={res.away??''} onChange={v=>updateResult(gm.id,'away',v)}/>
                          </div>
                          <span style={{fontWeight:600,fontSize:12,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{gm.away}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              );
            })}
          </div>
        </div>
      )}

      {tab==='knockout'&&(
        (!state.knockoutGames||!state.knockoutGames.length)?
          <div style={{textAlign:'center',padding:'2rem'}}>
            <p style={{color:'var(--muted)',marginBottom:'1rem'}}>Inicialize o mata-mata após a fase de grupos.</p>
            <button className="btn btn-primary" onClick={initKnockout}>Inicializar Mata-Mata</button>
          </div>:
          <div className="scrollable">
            {KNOCKOUT_TEMPLATE.map(ph=>{
              const games=(state.knockoutGames||[]).filter(g=>g.phase===ph.phase);
              return(
                <div key={ph.phase} style={{marginBottom:'1.25rem'}}>
                  <div className="group-header"><h2 style={{fontSize:'.85rem'}}>{ph.label}</h2></div>
                  {games.map(gm=>(
                    <div key={gm.id} className="card-dark" style={{marginBottom:6}}>
                      <div style={{fontSize:10,color:'var(--muted)',marginBottom:5,textTransform:'uppercase'}}>Jogo {gm.id}</div>
                      <div className="flex gap-md" style={{flexWrap:'wrap',marginBottom:6}}>
                        <input placeholder="Time A" value={gm.home} onChange={e=>updateKO(gm.id,'home',e.target.value)} style={{flex:1,minWidth:110}}/>
                        <span style={{alignSelf:'center',color:'var(--muted)',fontSize:11}}>vs</span>
                        <input placeholder="Time B" value={gm.away} onChange={e=>updateKO(gm.id,'away',e.target.value)} style={{flex:1,minWidth:110}}/>
                      </div>
                      <div className="flex gap-md" style={{flexWrap:'wrap',marginBottom:6}}>
                        <input type="date" value={gm.date} onChange={e=>updateKO(gm.id,'date',e.target.value)} style={{width:135}}/>
                        <input type="time" value={gm.time} onChange={e=>updateKO(gm.id,'time',e.target.value)} style={{width:95}}/>
                        <input placeholder="Cidade" value={gm.city} onChange={e=>updateKO(gm.id,'city',e.target.value)} style={{flex:1}}/>
                      </div>
                      <div className="flex gap-md">
                        <span style={{fontSize:11,color:'var(--muted)'}}>Resultado:</span>
                        <ScoreInput value={state.results?.[gm.id]?.home??''} onChange={v=>updateResult(gm.id,'home',v)}/>
                        <span className="vs">X</span>
                        <ScoreInput value={state.results?.[gm.id]?.away??''} onChange={v=>updateResult(gm.id,'away',v)}/>
                      </div>
                    </div>
                  ))}
                </div>
              );
            })}
          </div>
      )}

      {tab==='bonus'&&(
        <div className="card" style={{maxWidth:560}}>
          <h2 style={{marginBottom:'.5rem'}}>Resultados Finais</h2>
          <p style={{fontSize:12,color:'var(--muted)',marginBottom:'1rem'}}>
            Adicione múltiplos nomes separados por vírgula. Ex: <strong style={{color:'var(--yellow)'}}>Kane, Harry Kane</strong>
          </p>
          {[
            {key:'finalChampion',label:'🏆 Campeão',list:SELECOES},
            {key:'finalRunnerUp',label:'🥈 Vice-Campeão',list:SELECOES},
            {key:'finalThird',label:'🥉 Terceiro Lugar',list:SELECOES},
            {key:'finalTopScorer',label:'⚽ Artilheiro',list:null},
          ].map(({key,label,list})=>(
            <div key={key} style={{marginBottom:'1rem'}}>
              <label style={{fontSize:12,color:'var(--muted)',display:'block',marginBottom:4}}>{label}</label>
              {list?(
                <div style={{display:'flex',gap:6,flexWrap:'wrap',marginBottom:4}}>
                  {list.map(s=>(
                    <span key={s}
                      onClick={()=>{
                        const cur=state[key]||'';
                        const parts=cur.split(',').map(x=>x.trim()).filter(Boolean);
                        if(!parts.includes(s)){setState(x=>({...x,[key]:[...parts,s].join(', ')}))}
                      }}
                      style={{background:(state[key]||'').split(',').map(x=>x.trim()).includes(s)?'#ffd60033':'var(--surface3)',
                        border:`1px solid ${(state[key]||'').split(',').map(x=>x.trim()).includes(s)?'#ffd600':'var(--border)'}`,
                        borderRadius:6,padding:'2px 8px',fontSize:11,cursor:'pointer',
                        color:(state[key]||'').split(',').map(x=>x.trim()).includes(s)?'var(--yellow)':'var(--muted)',
                        transition:'all .15s'}}>
                      {s}
                    </span>
                  ))}
                </div>
              ):null}
              <input value={state[key]||''} onChange={e=>setState(s=>({...s,[key]:e.target.value}))}
                placeholder={list?"Clique nas seleções acima ou digite":"Ex: Kane, Harry Kane, Harry"}
                style={{fontSize:13}}/>
              <div style={{fontSize:10,color:'var(--muted)',marginTop:3}}>
                Aliases aceitos: {(state[key]||'').split(',').filter(x=>x.trim()).length} variação(ões)
              </div>
            </div>
          ))}
        </div>
      )}

      {tab==='config'&&(
        <div className="card" style={{maxWidth:440}}>
          <h2 style={{marginBottom:'1rem'}}>Pontuação</h2>
          <div className="config-grid">
            {[
              {key:'exactScore',label:'🎯 Cravada (placar exato)'},
              {key:'onlyWinner',label:'👍 Resultado (vencedor ou empate)'},
              {key:'champion',label:'🏆 Campeão'},
              {key:'runnerUp',label:'🥈 Vice-Campeão'},
              {key:'third',label:'🥉 Terceiro Lugar'},
              {key:'topScorer',label:'⚽ Artilheiro da Copa'},
              {key:'lockBefore',label:'🔒 Bloquear X min antes'},
            ].map(({key,label})=>(
              <React.Fragment key={key}>
                <label>{label}</label>
                <input type="number" min="0" style={{width:75,textAlign:'center'}} value={state.config[key]||0}
                  onChange={e=>setState(s=>({...s,config:{...s.config,[key]:parseInt(e.target.value)||0}}))}/>
              </React.Fragment>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function LoginView({state,onLoginPlayer,onLoginAdmin}){
  const[user,setUser]=useState('');
  const[pass,setPass]=useState('');
  const[err,setErr]=useState('');
  const[mode,setMode]=useState('player');

  function doLogin(){
    setErr('');
    if(mode==='admin'){
      if(user===ADMIN_USER&&pass===ADMIN_PASS){onLoginAdmin();return;}
      setErr('Usuário ou senha incorretos.');return;
    }
    const u=user.trim().toLowerCase();
    const found=state.players.find(x=>(
      (x.username&&x.username.toLowerCase()===u)||
      (x.email&&x.email.toLowerCase()===u)||
      (x.name&&x.name.toLowerCase()===u)
    )&&x.password===pass);
    if(found){onLoginPlayer(found.id);return;}
    setErr('Usuário, e-mail ou nome incorretos.');
  }

  return(
    <div style={{minHeight:'80vh',display:'flex',alignItems:'center',justifyContent:'center',padding:'1.5rem'}}>
      <div className="login-card">
        <div className="login-logo">Bolão do Vini</div>
        <div className="login-sub">Copa do Mundo 2026 ⚽</div>
        <div className="tab" style={{marginBottom:'1.25rem'}}>
          <button className={`tab-btn ${mode==='player'?'active':''}`} style={{flex:1}} onClick={()=>{setMode('player');setErr('')}}>Jogador</button>
          <button className={`tab-btn ${mode==='admin'?'active':''}`} style={{flex:1}} onClick={()=>{setMode('admin');setErr('')}}>Admin</button>
        </div>
        <div className="flex-col gap-md">
          <div>
            <label style={{fontSize:12,color:'var(--muted)',display:'block',marginBottom:4}}>Usuário</label>
            <input value={user} onChange={e=>setUser(e.target.value)} placeholder={mode==='admin'?'admin':'Usuário, e-mail ou nome'} onKeyDown={e=>e.key==='Enter'&&doLogin()}/>
          </div>
          <div>
            <label style={{fontSize:12,color:'var(--muted)',display:'block',marginBottom:4}}>Senha</label>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&doLogin()}/>
          </div>
          {err&&<div style={{fontSize:12,color:'var(--red)',background:'#ff3d5711',padding:'6px 10px',borderRadius:6}}>{err}</div>}
          <button className="btn btn-primary" onClick={doLogin} style={{width:'100%',marginTop:4}}>Entrar →</button>
        </div>
        {mode==='player'&&(
          <p style={{fontSize:11,color:'var(--muted)',marginTop:'1rem',textAlign:'center'}}>
            Use o usuário e senha definidos no cadastro.<br/>
            <a href="cadastro.html" style={{color:'var(--yellow)',textDecoration:'none',fontWeight:700,fontSize:12}}>
              Não tem cadastro? Cadastre-se aqui →
            </a>
          </p>
        )}
      </div>
    </div>
  );
}

// ── APP ──────────────────────────────────────────
const DEFAULT_STATE={
  players:[],picks:{},results:{},knockoutGames:[],
  config:{exactScore:10,onlyWinner:5,topScorer:15,champion:15,runnerUp:15,third:15,lockBefore:60},
  adminPass:'H7taj2kd*',
  finalTopScorer:'',finalChampion:'',finalRunnerUp:'',finalThird:'',
};

function App(){
  const[state,setStateRaw]=useState(DEFAULT_STATE);
  const[view,setView]=useState('ranking');
  const[session,setSession]=useState(null);
  const[loading,setLoading]=useState(true);
  const[loadErr,setLoadErr]=useState('');
  const[saving,setSaving]=useState('');

  useEffect(()=>{
    ghFetch().then(data=>{
      setStateRaw(s=>({...DEFAULT_STATE,...data}));
      setLoading(false);
    }).catch(e=>{setLoadErr(e.message);setLoading(false)});
  },[]);

  useEffect(()=>{
    const p=new URLSearchParams(window.location.search).get('player');
    if(p&&p.length>3)setSession({type:'player',playerId:p.toUpperCase()});
  },[]);

  function setState(updater){
    setStateRaw(prev=>typeof updater==='function'?updater(prev):updater);
  }

  async function handleSave(){
    setSaving('saving');
    try{
      const toSave={...state};
      const allGames=[...GROUP_GAMES,...(state.knockoutGames||[])];
      const playerId=session?.type==='player'?session.playerId:null;
      await ghSave(toSave,playerId,allGames,state.config.lockBefore,session?.type==='admin');
      setSaving('ok');
    }catch(e){
      setSaving('error');
      alert('Erro ao salvar: '+e.message);
    }
    setTimeout(()=>setSaving(''),3000);
  }

  if(loading)return(
    <div style={{display:'flex',alignItems:'center',justifyContent:'center',height:'100vh',flexDirection:'column',gap:16}}>
      <div className="spinner" style={{width:36,height:36,borderWidth:3}}/>
      <p style={{color:'var(--muted)',fontSize:13}}>Carregando Bolão do Vini...</p>
    </div>
  );

  if(!session)return(
    <>
      {loadErr&&<div className="alert alert-warn" style={{margin:'1rem'}}>⚠️ {loadErr}</div>}
      <LoginView state={state}
        onLoginPlayer={pid=>{setSession({type:'player',playerId:pid});setView('picks')}}
        onLoginAdmin={()=>{setSession({type:'admin'});setView('admin')}}
      />
    </>
  );

  const isAdmin=session.type==='admin';
  const isPlayer=session.type==='player';

  const navItems=[
    {id:'ranking',label:'Ranking'},
    {id:'proximos',label:'Jogos'},
    {id:'charts',label:'Gráficos'},
    {id:'regulamento',label:'Regulamento'},
    ...(isPlayer?[{id:'picks',label:'Meus Palpites'}]:[]),
    ...(isAdmin?[{id:'admin',label:'⚙️ Admin'}]:[]),
  ];

  return(
    <div className="app">
      <header className="header">
        <div className="header-inner">
          <div className="logo" onClick={()=>setView('ranking')}>Bolão do Vini</div>
          <nav className="nav">
            {navItems.map(n=>(
              <button key={n.id} className={`nav-btn ${view===n.id?'active':''}`} onClick={()=>setView(n.id)}>{n.label}</button>
            ))}
            <button className="nav-btn" onClick={()=>setSession(null)} style={{color:'var(--red)'}}>Sair</button>
          </nav>
        </div>
      </header>
      {loadErr&&<div className="alert alert-warn" style={{margin:'1rem 1.25rem 0'}}>⚠️ {loadErr}</div>}
      <main className="content">
        {view==='ranking'&&<RankingView state={state}/>}
        {view==='picks'&&isPlayer&&<PlayerView state={state} setState={setState} onSave={handleSave} saving={saving} playerId={session.playerId}/>}
        {view==='charts'&&<ChartView state={state}/>}
        {view==='proximos'&&<ProximosJogos state={state} session={session}/>}
        {view==='regulamento'&&<Regulamento/>}
        {view==='admin'&&isAdmin&&<AdminView state={state} setState={setState} onSave={handleSave} saving={saving}/>}
      </main>
      <SavingBar status={saving}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
