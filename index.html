// Round grouping for line chart
function getGameRound(g){
  if(!g.date)return'Mata-Mata';
  const d=new Date(g.date+'T00:00:00-03:00');
  const m=d.getMonth()+1,day=d.getDate();
  // Test games
  if(g.group==='LIB')return'🏆 Libertadores';
  if(g.group==='SUL')return'🏆 Sul-Americana';
  // Group stage rounds based on date ranges
  if(m===6&&day>=11&&day<=17)return'Rodada 1';
  if(m===6&&day>=18&&day<=24)return'Rodada 2';
  if(m===6&&day>=25||m===7&&day<=2)return'Rodada 3';
  // Knockout
  const phase=g.phase||'';
  if(phase==='R16')return'Oitavas';
  if(phase==='QF')return'Quartas';
  if(phase==='SF')return'Semifinais';
  if(phase==='3P'||phase==='3PL')return'3º Lugar';
  if(phase==='F')return'Final';
  return'Mata-Mata';
}

function shortName(name){
  if(!name)return'';
  const parts=name.trim().split(' ').filter(Boolean);
  if(parts.length===1)return parts[0];
  const first=parts[0].charAt(0).toUpperCase()+parts[0].slice(1).toLowerCase();

  return`${first} ${last}`;
}

function calcPoints(pick,result,cfg,isKnockout){
  if(!result||result.home===''||result.home===undefined||result.away===''||result.away===undefined)return null;
  if(!pick||pick.home===''||pick.home===undefined||pick.away===''||pick.away===undefined)return 0;
  const ph=parseInt(pick.home),pa=parseInt(pick.away);
  const rh=parseInt(result.home),ra=parseInt(result.away);
  if(isNaN(ph)||isNaN(pa)||isNaN(rh)||isNaN(ra))return 0;
  const exact=(cfg?.exactScore||10);
  const winner=(cfg?.onlyWinner||5);
  if(ph===rh&&pa===ra)return exact;
  const pw=ph>pa?'H':ph<pa?'A':'D';
  const rw=rh>ra?'H':rh<ra?'A':'D';
  if(pw!==rw)return 0;
  return winner;
}

function computeScores(state){
  const{players,picks,results,config,knockoutGames=[]}=state;
  const scores={};
  players.forEach(p=>{
    let pts=0,exact=0;
    GROUP_GAMES.forEach(g=>{
      const res=results[g.id];
      const pick=(picks[p.id]||{})[g.id];
      const pt=calcPoints(pick,res,config,false);
      if(pt>0){pts+=pt;if(pt===(config?.exactScore||10))exact++;}
    });
    knockoutGames.forEach(g=>{
      const res=results[g.id];
      const pick=(picks[p.id]||{})[g.id];
      const pt=calcPoints(pick,res,config,true);
      if(pt>0){pts+=pt;if(pt===(config?.exactScore||10))exact++;}
    });
    function matchAlias(pick,finalVal){
      if(!pick||!finalVal)return false;
      const aliases=finalVal.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
      return aliases.includes(pick.trim().toLowerCase());
    }
    if(matchAlias(p.topScorer,state.finalTopScorer))pts+=config.topScorer;
    const bp=p.bonusPicks||{};
    if(matchAlias(bp.champion,state.finalChampion))pts+=config.champion;
    if(matchAlias(bp.runnerUp,state.finalRunnerUp))pts+=config.runnerUp;
    if(matchAlias(bp.third,state.finalThird))pts+=config.third;
    scores[p.id]={total:pts,exact};
  });
  return scores;
}

function isLocked(game,lockMin){
  if(!game||!game.date||!game.time)return false;
  let date=game.date;
  if(date.includes('/')){
    const parts=date.split('/');
    if(parts.length===3) date=`${parts[2]}-${parts[1].padStart(2,'0')}-${parts[0].padStart(2,'0')}`;
  }
  const dt=new Date(`${date}T${game.time}:00-03:00`);
  if(isNaN(dt.getTime()))return false;
  return Date.now()>=(dt.getTime()-lockMin*60000);
}

let _sha='';

async function ghFetch(){
  const url=`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}?ref=main&t=${Date.now()}`;
  const res=await fetch(url,{headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${GITHUB_TOKEN}`}});
  if(!res.ok)throw new Error(`GitHub ${res.status}`);
  const json=await res.json();
  _sha=json.sha;
  // CORREÇÃO: usa fromBase64 com suporte a UTF-8
  return JSON.parse(fromBase64(json.content.replace(/\n/g,'')));
}

async function logSuspeita(entry){
  try{
    // Fetch current suspeita.json
    const url=`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${SUSPEITA_PATH}?t=${Date.now()}`;
    const res=await fetch(url,{headers:{'Accept':'application/vnd.github+json','Authorization':`Bearer ${GITHUB_TOKEN}`}});
    let lista=[],sha='';
    if(res.ok){
      const json=await res.json();
      sha=json.sha;
      try{lista=JSON.parse(fromBase64(json.content.replace(/\n/g,'')));}catch(e){}
    }
    lista.unshift(entry);
    if(lista.length>200)lista.splice(200);
    const putUrl=`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${SUSPEITA_PATH}`;
    const body={message:'⚠️ alteracao suspeita detectada',content:toBase64(JSON.stringify(lista,null,2)),branch:'main'};
    if(sha)body.sha=sha;
    await fetch(putUrl,{method:'PUT',headers:{'Authorization':`Bearer ${GITHUB_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  }catch(e){console.warn('suspeita log failed:',e);}
}

async function getServerTimeBrasilia(){
  const res=await fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`,{
    headers:{'Authorization':`Bearer ${GITHUB_TOKEN}`,'Accept':'application/vnd.github+json'}
  });
  const dateHeader=res.headers.get('Date');
  if(!dateHeader)return Date.now();
  return new Date(dateHeader).getTime();
}

function isLockedByServerTime(game,lockMin,serverNowMs){
  if(!game.date||!game.time)return false;
  const dt=new Date(`${game.date}T${game.time}:00-03:00`);
  return serverNowMs>=(dt.getTime()-lockMin*60000);
}

// ── MERGE SEGURO COM RETRY ─────────────────────────────────────────
// CORREÇÃO PRINCIPAL: em vez de salvar o state inteiro do navegador,
// sempre buscamos o estado mais recente do GitHub, aplicamos APENAS
// a mudança deste jogador/admin, e salvamos. Se houver conflito de SHA
// (duas pessoas salvando ao mesmo tempo), aguardamos e tentamos de novo.
async function safeMergeSave(updateFn, retries=4){
  for(let i=0; i<retries; i++){
    try{
      const fresh = await ghFetch(); // busca estado atual + SHA atual
      updateFn(fresh);               // aplica apenas a mudança necessária
      const url=`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${DATA_PATH}`;
      const body={
        message:'bolão: update',
        // CORREÇÃO: usa toBase64 com suporte a UTF-8
        content: toBase64(JSON.stringify(fresh,null,2)),
        sha:_sha,
        branch:'main'
      };
      const res=await fetch(url,{method:'PUT',headers:{'Authorization':`Bearer ${GITHUB_TOKEN}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
      if(!res.ok){
        const e=await res.json();
        // Conflito de SHA = outra pessoa salvou antes de nós
        if(res.status===409||(e.message&&e.message.includes('sha'))){
          await new Promise(r=>setTimeout(r,700*(i+1)));
          continue; // tenta de novo com SHA novo
        }
        throw new Error(e.message||res.status);
      }
      const json=await res.json();
      _sha=json.content.sha;
      return true;
    }catch(err){
      if(i===retries-1)throw err;
      await new Promise(r=>setTimeout(r,700*(i+1)));
    }
  }
}

async function ghSave(data, picksPlayerId, allGames, lockMin, isAdmin=false){
  if(isAdmin){
    // Detectar alterações suspeitas: resultado alterado após horário do jogo
    const serverNowCheck=await getServerTimeBrasilia();
    const allGamesCheck=[...GROUP_GAMES,...(data.knockoutGames||[])];
    const freshCheck=await ghFetch();
    allGamesCheck.forEach(g=>{
      const oldRes=freshCheck.results?.[g.id];
      const newRes=data.results?.[g.id];
      if(!oldRes||!newRes)return;
      // Só suspeito se o jogo já terminou (passou da hora do jogo)
      if(!g.date||!g.time)return;
      const gameEnd=new Date(`${g.date}T${g.time}:00-03:00`).getTime()+120*60000; // +2h após início
      if(serverNowCheck<gameEnd)return;
      // Verificar se resultado mudou
      const oldH=String(oldRes.home||'').trim();
      const oldA=String(oldRes.away||'').trim();
      const newH=String(newRes.home||'').trim();
      const newA=String(newRes.away||'').trim();
      const hadResult=oldH!==''&&!isNaN(parseInt(oldH));
      const hasResult=newH!==''&&!isNaN(parseInt(newH));
      if(hadResult&&hasResult&&(oldH!==newH||oldA!==newA)){
        const now=new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});
        logSuspeita({
          timestamp:new Date().toISOString(),
          horario:now,
          jogo:`#${g.id} ${g.home} × ${g.away}`,
          data:`${g.date} ${g.time}`,
          resultadoAnterior:`${oldH}×${oldA}`,
          resultadoNovo:`${newH}×${newA}`,
          aviso:'Resultado alterado após término do jogo',
        });
      }
    });
    // Admin: merge seguro — NUNCA sobrescreve picks dos jogadores
    // Admin só pode alterar: results, knockoutGames, config, players (cadastro), finais
    // Picks de cada jogador são PRESERVADOS do servidor — admin não mexe neles
    await safeMergeSave(fresh=>{
      fresh.results       = data.results;
      fresh.knockoutGames = data.knockoutGames;
      fresh.config        = data.config;
      fresh.finalTopScorer= data.finalTopScorer;
      fresh.finalChampion = data.finalChampion;
      fresh.finalRunnerUp = data.finalRunnerUp;
      fresh.finalThird    = data.finalThird;
      // Players: merge seguro — preserva picks e dados que o jogador pode ter atualizado
      // Só atualiza campos que o admin gerencia (nome, username, email, password)
      // Nunca sobrescreve bonusPicks ou topScorer que o jogador preencheu
      data.players.forEach(adminPlayer=>{
        const idx=fresh.players.findIndex(p=>p.id===adminPlayer.id);
        if(idx>=0){
          // Preserva bonusPicks e topScorer do servidor (o jogador pode ter atualizado)
          fresh.players[idx]={
            ...fresh.players[idx],          // mantém tudo do servidor
            name:adminPlayer.name,          // admin pode editar nome
            username:adminPlayer.username,  // admin pode editar usuário
            email:adminPlayer.email,        // admin pode editar email
            password:adminPlayer.password,  // admin pode editar senha
          };
        } else {
          // Jogador novo adicionado pelo admin
          fresh.players.push(adminPlayer);
        }
      });
      // Remove jogadores que o admin removeu
      fresh.players=fresh.players.filter(fp=>data.players.some(ap=>ap.id===fp.id));
    });
    return;
  }

  if(picksPlayerId){
    // Jogador: merge SOMENTE dos dados deste jogador no estado mais recente
    const serverNow = await getServerTimeBrasilia();
    const playerData = data.players.find(p=>p.id===picksPlayerId);
    const playerPicks = (data.picks||{})[picksPlayerId]||{};

    await safeMergeSave(fresh=>{
      // Picks: aplica apenas os picks deste jogador, respeitando lock
      const serverPicks = (fresh.picks||{})[picksPlayerId]||{};
      const sanitized = {...playerPicks};
      if(allGames && lockMin!==undefined){
        allGames.forEach(g=>{
          if(isLockedByServerTime(g,lockMin,serverNow)){
            if(serverPicks[g.id]===undefined) delete sanitized[g.id];
            else sanitized[g.id]=serverPicks[g.id];
          }
        });
      }
      if(!fresh.picks) fresh.picks={};
      fresh.picks[picksPlayerId] = sanitized;

      // Dados pessoais: bonusPicks, topScorer
      if(playerData){
        const idx = fresh.players.findIndex(p=>p.id===picksPlayerId);
        if(idx>=0){
          fresh.players[idx].bonusPicks = playerData.bonusPicks||{};
          fresh.players[idx].topScorer  = playerData.topScorer||'';
        }
      }
    });
  }
}

function MatchRow({game,pick,onPick,locked,result,isKnockout,isGolden}){
  const[h,setH]=useState(pick?.home??'');
  const[a,setA]=useState(pick?.away??'');
  useEffect(()=>{setH(pick?.home??'');setA(pick?.away??'')},[pick]);
  function handle(side,val){
    const nh=side==='h'?val:h,na=side==='a'?val:a;
    side==='h'?setH(val):setA(val);
    onPick({home:nh,away:na});
  }
  const pts=result?calcPoints({home:h,away:a},result,{},isKnockout):null;

  let blockBg='var(--surface2)',blockBorder='var(--border)',resultLabel=null;
  if(result&&locked){
    if(pts>=(10)){
      blockBg='#00c85312';blockBorder='#00c85355';
      resultLabel=<div style={{fontSize:10,fontWeight:700,color:'#00c853',marginBottom:3,letterSpacing:.5}}>✅ ACERTOU O PLACAR!</div>;
    } else if(pts>0){
      blockBg='#ffd60012';blockBorder='#ffd60055';
      resultLabel=<div style={{fontSize:10,fontWeight:700,color:'#ffd600',marginBottom:3,letterSpacing:.5}}>🟡 ACERTO PARCIAL</div>;
    } else if(pts===0){
      blockBg='#ff3d5712';blockBorder='#ff3d5755';
      resultLabel=<div style={{fontSize:10,fontWeight:700,color:'#ff3d57',marginBottom:3,letterSpacing:.5}}>❌ ERROU</div>;
    }
  }

  const ptsBadge=pts===null?null:pts>=10?'badge-green':pts>0?'badge-yellow':'badge-red';

  return(
    <div style={{background:isGolden&&!locked?'#ffd60005':blockBg,border:`1px solid ${isGolden&&!locked?'#ffd60044':blockBorder}`,borderRadius:10,padding:'.6rem .8rem',marginBottom:6,transition:'background .3s,border .3s',pointerEvents:locked?'none':'auto'}}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'.3rem'}}>
        <span style={{fontFamily:"'Bebas Neue'",fontSize:'.85rem',color:'var(--muted)'}}>#{game.id} · {game.date?game.date.slice(8)+'/'+game.date.slice(5,7):''} {game.time}</span>
        <div style={{display:'flex',alignItems:'center',gap:5}}>
          {locked&&<span style={{fontSize:11}}>🔒</span>}
          {ptsBadge&&<span className={`badge ${ptsBadge}`}>{pts}pts</span>}
        </div>
      </div>
      {result&&result.home!==''&&result.home!==undefined&&(
        <div style={{marginBottom:'.4rem'}}>
          {locked&&resultLabel}
          <div style={{display:'inline-flex',alignItems:'center',gap:8,background:'#00000030',borderRadius:7,padding:'4px 12px'}}>
            <span style={{fontSize:10,color:'var(--muted)'}}>Resultado:</span>
            <span style={{fontFamily:"'Bebas Neue'",fontSize:17,color:'#fff',letterSpacing:2}}>{game.home.split(' ')[0]} {result.home} × {result.away} {game.away.split(' ')[0]}</span>
          </div>
        </div>
      )}
      <div style={{display:'flex',alignItems:'center',gap:6,opacity:locked?.8:1}}>
        <span style={{fontWeight:600,fontSize:13,flex:1,textAlign:'right',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{game.home}</span>
        <div style={{display:'flex',alignItems:'center',gap:4,flexShrink:0}}>
          <ScoreInput value={h} onChange={v=>handle('h',v)} disabled={locked}/>
          <span style={{color:'var(--muted)',fontSize:10,fontWeight:700}}>×</span>
          <ScoreInput value={a} onChange={v=>handle('a',v)} disabled={locked}/>
        </div>
        <span style={{fontWeight:600,fontSize:13,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{game.away}</span>
      </div>
    </div>
  );
}

function ChartView({state}){
  const refs={line:useRef(null),bars:useRef(null),heat:useRef(null),dist:useRef(null),gap:useRef(null),form:useRef(null)};
  const wrapRef=useRef(null);
  const [tick,setTick]=useState(0);
  const [roundFilter,setRoundFilter]=useState('game'); // 'all' or a round name
  const [tooltip,setTooltip]=useState(null); // {x,y,text}
  const hoverDataRef=useRef({}); // stores hover regions per chart
  const CLIST=['#ffd600','#00c853','#1e88e5','#ff3d57','#ab47bc','#ff7043','#26c6da','#66bb6a','#ef5350','#42a5f5','#ffca28'];

  // Filter state
  const [hiddenPlayers,setHiddenPlayers]=useState(new Set());
  const [phaseFilter,setPhaseFilter]=useState('all'); // 'all' | 'group' | 'knockout'
  function togglePlayer(id){
    setHiddenPlayers(prev=>{
      const next=new Set(prev);
      next.has(id)?next.delete(id):next.add(id);
      return next;
    });
  }

  const allGames=useMemo(()=>[...GROUP_GAMES,...(state.knockoutGames||[])].filter(g=>g.home&&g.away),[state.knockoutGames]);
  // Check ALL possible game IDs from results (not just allGames which filters by home&&away)
  const allPossibleGames=useMemo(()=>[...GROUP_GAMES,...(state.knockoutGames||[])],[state.knockoutGames]);
  const gamesWithResultAll=useMemo(()=>allPossibleGames.filter(g=>{
    const r=state.results?.[g.id];
    return r&&r.home!==''&&r.home!==undefined&&r.away!==''&&r.away!==undefined&&!isNaN(parseInt(r.home))&&!isNaN(parseInt(r.away));
  }),[allPossibleGames,state.results]);
  const knockoutIds=useMemo(()=>new Set((state.knockoutGames||[]).map(g=>g.id)),[state.knockoutGames]);
  const gamesWithResult=useMemo(()=>gamesWithResultAll.filter(g=>{
    if(phaseFilter==='group')return!knockoutIds.has(g.id);
    if(phaseFilter==='knockout')return knockoutIds.has(g.id);
    return true;
  }),[gamesWithResultAll,phaseFilter,knockoutIds]);

  // Totais fixos Copa 2026 (72 grupos + 32 mata-mata = 104)
  const TOTAL_GROUP=72;
  const TOTAL_KNOCKOUT=32;
  const TOTAL_ALL=TOTAL_GROUP+TOTAL_KNOCKOUT; // 104

  const totalFixed=phaseFilter==='group'?TOTAL_GROUP:phaseFilter==='knockout'?TOTAL_KNOCKOUT:TOTAL_ALL;
  const scored=gamesWithResult.length;
  const pct=Math.round(scored/totalFixed*100);
  const remaining=totalFixed-scored;
  const exactPts=state.config?.exactScore||10;
  const ptsDone=scored*exactPts;
  const ptsLeft=remaining*exactPts;

  const detailed=useMemo(()=>computeDetailedScores(state),[state]);
  const allRanked=useMemo(()=>state.players.map((p,i)=>({...p,...detailed[p.id]||{total:0,exact:0,onlyWinner:0},color:CLIST[i%CLIST.length]})).sort((a,b)=>b.total-a.total),[state.players,detailed]);
  const ranked=useMemo(()=>allRanked.filter(p=>!hiddenPlayers.has(p.id)),[allRanked,hiddenPlayers]);

  function dc(key,fn){
    const canvas=refs[key]?.current;const wrap=wrapRef.current;
    if(!canvas||!wrap)return;
    const dpr=window.devicePixelRatio||1;
    const wrapW=wrap.offsetWidth||wrap.parentElement?.offsetWidth||800;
    if(wrapW<10)return; // not visible yet
    const distMinW=key==='dist'?Math.max(wrapW,Math.min(5,gamesWithResult.length)*(isMobileCanvas?140:200)):wrapW;
    const heatMinW=key==='heat'?Math.max(wrapW,gamesWithResult.slice(-20).length*34+95):wrapW;
    const scrollChartMin=scrollCharts.has(key)?Math.max(wrapW,key==='dist'?distMinW:key==='heat'?heatMinW:ranked.length*54+60):wrapW;
    const CW=scrollChartMin;
    const isMobileCanvas=wrapW<480;
    const CH=key==='heat'?Math.max(160,state.players.length*(isMobileCanvas?28:34)+56):isMobileCanvas?200:240;
    canvas.style.width=CW+'px';canvas.style.height=CH+'px';
    canvas.width=Math.round(CW*dpr);canvas.height=Math.round(CH*dpr);
    const ctx=canvas.getContext('2d');ctx.scale(dpr,dpr);
    ctx.fillStyle='#0d1220';ctx.fillRect(0,0,CW,CH);
    fn(ctx,CW,CH);
  }

  function gridLines(ctx,CW,CH,pad,steps,maxVal){
    const isMobile=CW<500;
    for(let i=0;i<=steps;i++){
      const v=Math.round(maxVal*i/steps);
      const y=pad.t+(CH-pad.t-pad.b)*(1-i/steps);
      ctx.strokeStyle='#2a3560';ctx.lineWidth=.4;
      ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(CW-pad.r,y);ctx.stroke();
      ctx.fillStyle='#7b89b0';ctx.font=`${isMobile?8:9}px system-ui`;ctx.textAlign='right';
      ctx.fillText(v,pad.l-4,y+3);
    }
  }

  function noData(ctx,CW,CH,msg){
    ctx.fillStyle='#7b89b0';ctx.font='13px system-ui';ctx.textAlign='center';
    ctx.fillText(msg||'Aguardando resultados...',CW/2,CH/2);
  }

  // 1. Linha — evolução acumulada
  function drawLine(ctx,CW,CH){
    if(gamesWithResult.length<1){noData(ctx,CW,CH);return;}
    const isMobile=CW<500;
    const pad={t:20,r:isMobile?60:90,b:24,l:40};
    const gW=CW-pad.l-pad.r,gH=CH-pad.t-pad.b;

    // Build X axis: by game or by round
    let xPoints; // [{label, games:[]}]
    if(roundFilter==='round'){
      const roundMap={};
      const roundOrder=[];
      gamesWithResult.forEach(g=>{
        const r=getGameRound(g);
        if(!roundMap[r]){roundMap[r]=[];roundOrder.push(r);}
        roundMap[r].push(g);
      });
      xPoints=roundOrder.map(r=>({label:r,games:roundMap[r]}));
    } else {
      xPoints=gamesWithResult.map(g=>({label:'J'+g.id,games:[g]}));
    }

    if(!xPoints.length){noData(ctx,CW,CH);return;}

    // Compute series: cumulative points per xPoint
    const series=ranked.map(s=>{
      let cum=0;
      const pts=xPoints.map(xp=>{
        xp.games.forEach(g=>{
          const pick=(state.picks?.[s.id]||{})[g.id];
          const res=state.results?.[g.id];
          if(pick&&res)cum+=calcPoints(pick,res,state.config,false);
        });
        return cum;
      });
      return{...s,pts};
    });

    const maxV=Math.max(...series.map(s=>s.pts[s.pts.length-1]||0),1);
    const xS=xPoints.length>1?gW/(xPoints.length-1):gW;

    // Grid
    gridLines(ctx,CW,CH,pad,4,maxV);

    // X axis labels
    const step=Math.max(1,Math.floor(xPoints.length/10));
    xPoints.forEach((xp,i)=>{
      if(i%step!==0&&i!==xPoints.length-1)return;
      const x=pad.l+i*xS;
      ctx.fillStyle='#7b89b0';ctx.font=`${isMobile?7:8}px system-ui`;ctx.textAlign='center';
      const lbl=roundFilter==='round'?xp.label.replace('Rodada ','R').replace('Libertadores','Lib').replace('Sul-Americana','Sul'):xp.label;
      ctx.fillText(lbl,x,CH-6);
    });

    // Lines
    series.forEach(s=>{
      if(!s.pts.length)return;
      ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.lineJoin='round';
      ctx.beginPath();
      s.pts.forEach((v,i)=>{
        const x=pad.l+i*(xPoints.length>1?gW/(xPoints.length-1):0);
        const y=pad.t+gH*(1-v/maxV);
        i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
      });
      ctx.stroke();
      // Dots
      s.pts.forEach((v,i)=>{
        const x=pad.l+i*(xPoints.length>1?gW/(xPoints.length-1):0);
        const y=pad.t+gH*(1-v/maxV);
        ctx.beginPath();ctx.arc(x,y,3,0,Math.PI*2);ctx.fillStyle=s.color;ctx.fill();
      });
      // Label at end
      const lx=pad.l+(s.pts.length-1)*(xPoints.length>1?gW/(xPoints.length-1):0)+5;
      const ly=pad.t+gH*(1-s.pts[s.pts.length-1]/maxV);
      ctx.fillStyle=s.color;ctx.font=`bold ${isMobile?8:9}px system-ui`;ctx.textAlign='left';
      ctx.fillText(shortName(s.name),lx,ly+3);
    });

    // Hover regions: vertical bands
    hoverDataRef.current['line']=[];
    const bW=xPoints.length>1?gW/(xPoints.length-1):gW;
    xPoints.forEach((xp,i)=>{
      const x=pad.l+i*(xPoints.length>1?gW/(xPoints.length-1):0);
      const sorted=[...series].sort((a,b)=>(b.pts[i]||0)-(a.pts[i]||0));
      hoverDataRef.current['line'].push({
        x:x-bW/2,y:pad.t,w:bW,h:gH,
        title:xp.label,
        lines:sorted.map(s=>({name:shortName(s.name),value:(s.pts[i]||0)+'pts',color:s.color}))
      });
    });
  }


  // 2. Barras — cravadas vs resultados
  function drawBars(ctx,CW,CH){
    const isMobile=CW<500;
    const pad={t:28,r:12,b:isMobile?52:56,l:isMobile?28:38};
    const gW=CW-pad.l-pad.r,gH=CH-pad.t-pad.b;
    const data=ranked; // já ordenado por ranking
    if(!data.length)return;
    const maxV=Math.max(...data.map(d=>(d.exact||0)+(d.onlyWinner||0)),1);

    // Cada jogador tem 2 barras lado a lado
    const groupW=Math.max(isMobile?28:40,Math.min(isMobile?52:70,gW/data.length-6));
    const bW=(groupW-2)/2; // cada barra ocupa metade do grupo
    const gap=(gW-groupW*data.length)/(data.length+1);

    // grid lines
    for(let i=0;i<=4;i++){
      const v=Math.round(maxV*i/4);
      const y=pad.t+gH*(1-i/4);
      ctx.strokeStyle='#2a3560';ctx.lineWidth=.4;
      ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+gW,y);ctx.stroke();
      ctx.fillStyle='#7b89b0';ctx.font=`${isMobile?8:9}px system-ui`;ctx.textAlign='right';
      ctx.fillText(v,pad.l-4,y+3);
    }

    // legend
    ctx.fillStyle='#00c853';ctx.fillRect(pad.l,6,10,8);
    ctx.fillStyle='#c8d0e0';ctx.font='9px system-ui';ctx.textAlign='left';ctx.fillText(' Cravadas',pad.l+12,14);
    ctx.fillStyle='#ffd600';ctx.fillRect(pad.l+90,6,10,8);
    ctx.fillStyle='#c8d0e0';ctx.fillText(' Resultados',pad.l+102,14);

    data.forEach((d,i)=>{
      const gx=pad.l+gap*(i+1)+groupW*i;
      const cx=gx+groupW/2; // centro do grupo para o nome

      const hE=(d.exact||0)/maxV*gH;
      const hW=(d.onlyWinner||0)/maxV*gH;
      const baseY=pad.t+gH;

      // Barra verde (cravadas) — esquerda
      if(hE>0){
        ctx.fillStyle='#00c85355';ctx.fillRect(gx,baseY-hE,bW,hE);
        ctx.strokeStyle='#00c853';ctx.lineWidth=1.5;ctx.strokeRect(gx,baseY-hE,bW,hE);
        ctx.fillStyle='#00c853';ctx.font=`bold ${isMobile?9:10}px system-ui`;ctx.textAlign='center';
        ctx.fillText(d.exact,gx+bW/2,baseY-hE-4);
      }

      // Barra amarela (resultados) — direita
      if(hW>0){
        ctx.fillStyle='#ffd60055';ctx.fillRect(gx+bW+2,baseY-hW,bW,hW);
        ctx.strokeStyle='#ffd600';ctx.lineWidth=1.5;ctx.strokeRect(gx+bW+2,baseY-hW,bW,hW);
        ctx.fillStyle='#ffd600';ctx.font=`bold ${isMobile?9:10}px system-ui`;ctx.textAlign='center';
        ctx.fillText(d.onlyWinner,gx+bW+2+bW/2,baseY-hW-4);
      }

      // Nome em duas linhas
      const parts=d.name.trim().split(' ').filter(Boolean);
      const first=parts[0]||'';
      const last=parts.length>1?parts[parts.length-1]:'';
      const maxLen=isMobile?6:8;
      const f=first.length>maxLen?first.slice(0,maxLen-1)+'…':first;
      const l=last.length>maxLen?last.slice(0,maxLen-1)+'…':last;
      ctx.fillStyle='#c8d0e0';ctx.font=`${isMobile?8:9}px system-ui`;ctx.textAlign='center';
      ctx.fillText(f,cx,CH-pad.b+13);
      if(l){ctx.fillStyle='#4a5580';ctx.fillText(l,cx,CH-pad.b+24);}
    });
  }

  // 3. Mapa de calor
  function drawHeat(ctx,CW,CH){
    const games=gamesWithResult.slice(-20);
    if(!games.length){noData(ctx,CW,CH,'Nenhum resultado ainda');return;}
    const pT=28;
    const isMobileH=CW<480;
    const pLH=isMobileH?72:92;
    const cW=Math.max(14,Math.min(isMobileH?22:34,(CW-pLH-8)/games.length));
    const cH=32;
    ctx.fillStyle='#7b89b0';ctx.font='8px system-ui';ctx.textAlign='center';
    games.forEach((g,i)=>{
      const cx=pLH+i*cW+cW/2;
      if(g.home&&g.away&&cW>=20){
        ctx.font=`${Math.min(cW-4,16)}px serif`;ctx.textAlign='center';
        ctx.fillText(flag(g.home),cx,12);
        ctx.fillText(flag(g.away),cx,26);
      } else {
        ctx.fillStyle='#7b89b0';ctx.font='8px system-ui';ctx.textAlign='center';
        ctx.fillText('J'+g.id,cx,18);
      }
    });
    const heatSorted=[...ranked].sort((a,b)=>b.total-a.total);
    heatSorted.forEach((p,pi)=>{
      const y=pT+pi*cH;
      const nm=shortName(p.name);
      const nmTrunc=nm.length>10?nm.slice(0,9)+'…':nm;
      ctx.fillStyle='#c8d0e0';ctx.font='9px system-ui';ctx.textAlign='right';
      ctx.fillText(nmTrunc,pLH-5,y+cH/2-1);
      const pts=p.total||0;
      ctx.fillStyle=pts>0?'#ffd60099':'#3a4570';ctx.font='bold 8px system-ui';
      ctx.fillText(pts+'pts',pLH-5,y+cH/2+9);
      games.forEach((g,gi)=>{
        const pick=(state.picks?.[p.id]||{})[g.id];
        const res=state.results?.[g.id];
        const pts=pick&&res?calcPoints(pick,res,state.config,false):null;
        let bg='#131929';
        if(pts===null)bg='#1c2540';
        else if(pts>=10)bg='#00c85344';
        else if(pts>0)bg='#ffd60033';
        else bg='#ff3d5733';
        const cx=pLH+gi*cW,cy=y;
        ctx.fillStyle=bg;ctx.fillRect(cx+1,cy+1,cW-2,cH-2);
        ctx.strokeStyle='#2a3560';ctx.lineWidth=.4;ctx.strokeRect(cx+1,cy+1,cW-2,cH-2);
        if(pts!==null){
          ctx.fillStyle=pts>=10?'#00c853':pts>0?'#ffd600':'#ff3d57';
          ctx.font='bold 9px system-ui';ctx.textAlign='center';
          ctx.fillText(pts,cx+cW/2,cy+cH/2+3);
        } else {
          ctx.fillStyle='#2a3560';ctx.font='9px system-ui';ctx.textAlign='center';
          ctx.fillText('–',cx+cW/2,cy+cH/2+3);
        }
      });
    });
    const ly=CH-12;
    [['Cravada','#00c853'],['Resultado','#ffd600'],['Errou','#ff3d57'],['S/palpite','#2a3560']].forEach(([l,c],i)=>{
      const lx=pLH+i*(isMobileH?70:95);
      ctx.fillStyle=c;ctx.fillRect(lx,ly-8,9,7);
      ctx.fillStyle='#c8d0e0';ctx.font='8px system-ui';ctx.textAlign='left';
      ctx.fillText(l,lx+12,ly);
    });
  }

  // 4. Distribuição palpites — último jogo travado
  function drawDist(ctx,CW,CH){
    const N=5;
    const recentGames=gamesWithResult.slice(-N);
    if(!recentGames.length){noData(ctx,CW,CH,'Nenhum jogo com resultado');return;}
    const isMobile=CW<500;

    // Each game gets a column
    const colW=Math.floor(CW/recentGames.length);
    const COLORS_D=['#ffd600','#00c853','#1e88e5','#ff3d57','#ab47bc','#ff7043','#26c6da'];

    // Header
    ctx.fillStyle='#7b89b0';ctx.font=`bold ${isMobile?9:10}px system-ui`;ctx.textAlign='center';
    recentGames.forEach((g,gi)=>{
      const cx=gi*colW+colW/2;
      ctx.fillStyle='#c8d0e0';
      ctx.fillText(g.home.split(' ')[0]+'×'+g.away.split(' ')[0],cx,14);
      ctx.fillStyle='#7b89b0';ctx.font=`${isMobile?8:9}px system-ui`;
      ctx.fillText('J'+g.id,cx,25);
    });

    recentGames.forEach((g,gi)=>{
      const cx=gi*colW;
      // Build freq
      const freq={};const pickPlayers={};
      state.players.forEach(p=>{
        const pick=(state.picks?.[p.id]||{})[g.id];
        if(!pick||pick.home===''||pick.home===undefined||isNaN(parseInt(pick.home)))return;
        const k=pick.home+'×'+pick.away;
        freq[k]=(freq[k]||0)+1;
        if(!pickPlayers[k])pickPlayers[k]=[];
        pickPlayers[k].push(shortName(p.name).split(' ')[0]);
      });
      const total=Object.values(freq).reduce((a,b)=>a+b,0);
      const entries=Object.entries(freq).sort((a,b)=>b[1]-a[1]);
      if(!entries.length)return;

      const res=state.results?.[g.id];
      const resultStr=res?res.home+'×'+res.away:'';
      const startY=35;
      const rowH=Math.min(38,Math.max(26,(CH-startY-10)/entries.length));
      const barMaxW=colW*0.38;

      // Result
      ctx.fillStyle='#00c853';ctx.font=`bold ${isMobile?10:11}px system-ui`;ctx.textAlign='center';
      ctx.fillText('✓ '+resultStr,cx+colW/2,startY+10);

      entries.forEach(([k,v],i)=>{
        const col=COLORS_D[i%COLORS_D.length];
        const y=startY+16+i*rowH;
        const bW=(v/total)*barMaxW;
        // bar
        ctx.fillStyle=col+'33';ctx.fillRect(cx+4,y,bW,rowH-6);
        ctx.strokeStyle=col;ctx.lineWidth=1.5;ctx.strokeRect(cx+4,y,bW,rowH-6);
        // score
        ctx.fillStyle='#fff';ctx.font=`bold ${isMobile?10:11}px system-ui`;ctx.textAlign='left';
        ctx.fillText(k,cx+7,y+rowH/2+2);
        // pct
        ctx.fillStyle=col;ctx.font=`${isMobile?8:9}px system-ui`;
        ctx.fillText(Math.round(v/total*100)+'%',cx+barMaxW+8,y+rowH/2+2);
        // names (short)
        const names=pickPlayers[k].join(', ');
        ctx.fillStyle='#4a5580';ctx.font=`${isMobile?7:8}px system-ui`;
        const maxNW=colW-barMaxW-20;
        let disp=names;
        while(ctx.measureText(disp).width>maxNW&&disp.length>4)
          disp=disp.slice(0,disp.lastIndexOf(','))+'…';
        ctx.fillText(disp,cx+barMaxW+8,y+rowH/2+12);
      });

      // Divider between columns
      if(gi<recentGames.length-1){
        ctx.strokeStyle='#2a3560';ctx.lineWidth=1;
        ctx.beginPath();ctx.moveTo((gi+1)*colW,30);ctx.lineTo((gi+1)*colW,CH-5);ctx.stroke();
      }
    });

    // Hover regions
    hoverDataRef.current['dist']=[];
    recentGames.forEach((g,gi)=>{
      const res=state.results?.[g.id];
      hoverDataRef.current['dist'].push({
        x:gi*colW,y:0,w:colW,h:CH,
        text:'J'+g.id+' '+g.home+'×'+g.away+(res?' | Resultado: '+res.home+'×'+res.away:'')
      });
    });
  }

  // 5. Distância para o líder
  function drawGap(ctx,CW,CH){
    if(gamesWithResult.length<2){noData(ctx,CW,CH);return;}
    const pad={t:14,r:16,b:32,l:40};
    const gW=CW-pad.l-pad.r,gH=CH-pad.t-pad.b;
    const cumByPlayer=ranked.map(p=>{
      let cum=0;
      return gamesWithResult.map(g=>{
        const r=state.results?.[g.id];
        const pick=(state.picks?.[p.id]||{})[g.id];
        cum+=(calcPoints(pick,r,state.config,false)||0);
        return cum;
      });
    });
    const gaps=ranked.map((p,pi)=>({...p,pts:gamesWithResult.map((_,gi)=>{
      const leader=Math.max(...cumByPlayer.map(c=>c[gi]||0));
      return leader-(cumByPlayer[pi][gi]||0);
    })}));
    const maxG=Math.max(...gaps.flatMap(s=>s.pts),1);
    const xS=gamesWithResult.length>1?gW/(gamesWithResult.length-1):gW;
    gridLines(ctx,CW,CH,pad,5,maxG);
    ctx.fillStyle='#7b89b0';ctx.font='8px system-ui';ctx.textAlign='center';
    gamesWithResult.forEach((g,i)=>ctx.fillText('J'+g.id,pad.l+i*xS,CH-6));
    // Líder
    ctx.fillStyle='#00c853';ctx.font='bold 9px system-ui';ctx.textAlign='left';
    ctx.fillText('Líder = 0pts atrás',pad.l+4,pad.t+10);
    gaps.forEach(s=>{
      if(s.pts.every(v=>v===0))return;
      ctx.strokeStyle=s.color;ctx.lineWidth=2;ctx.lineJoin='round';ctx.setLineDash([4,3]);
      ctx.beginPath();
      s.pts.forEach((v,i)=>{const x=pad.l+i*xS,y=pad.t+gH*(v/maxG);i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});
      ctx.stroke();ctx.setLineDash([]);
    });
    // Hover for gap chart
    hoverDataRef.current['gap']=[];
    const gapXS=gamesWithResult.length>1?gW/(gamesWithResult.length-1):gW;
    const leaderPts=cumByPlayer[0]||[];
    gamesWithResult.forEach((g,i)=>{
      const leader=leaderPts[i]||0;
      const lines=ranked.map((p,pi)=>{
        const pts=cumByPlayer[pi]?.[i]||0;
        const diff=leader-pts;
        return{name:shortName(p.name),value:diff===0?'🥇 Líder':'-'+diff+'pts',color:p.color};
      }).sort((a,b)=>{
        const da=parseInt(a.value)||0,db=parseInt(b.value)||0;
        return da-db;
      });
      hoverDataRef.current['gap'].push({
        x:pad.l+i*gapXS-gapXS/2,y:pad.t,w:gapXS,h:gH,
        title:'J'+g.id+' — Distância para o líder',
        lines
      });
    });
  }

  // 6. Forma recente — últimos 5 jogos
  function drawForm(ctx,CW,CH){
    const N=5;const recent=gamesWithResult.slice(-N);
    if(!recent.length){noData(ctx,CW,CH);return;}
    const pad={t:24,r:12,b:56,l:40};
    const gW=CW-pad.l-pad.r,gH=CH-pad.t-pad.b;
    const data=ranked.map(p=>{
      const pts=recent.map(g=>{
        const r=state.results?.[g.id];
        const pick=(state.picks?.[p.id]||{})[g.id];
        return calcPoints(pick,r,state.config,false)||0;
      });
      return{...p,total:pts.reduce((a,b)=>a+b,0),pts};
    }).sort((a,b)=>b.total-a.total);
    const maxV=Math.max(...data.map(d=>d.total),1);
    const bW=Math.min(50,gW/data.length-6);
    const gap=(gW-bW*data.length)/(data.length+1);
    for(let i=0;i<=4;i++){
      const v=Math.round(maxV*i/4);
      const y=pad.t+gH*(1-i/4);
      ctx.strokeStyle='#2a3560';ctx.lineWidth=.4;
      ctx.beginPath();ctx.moveTo(pad.l,y);ctx.lineTo(pad.l+gW,y);ctx.stroke();
      ctx.fillStyle='#7b89b0';ctx.font='9px system-ui';ctx.textAlign='right';
      ctx.fillText(v,pad.l-4,y+3);
    }
    ctx.fillStyle='#7b89b0';ctx.font='9px system-ui';ctx.textAlign='center';
    ctx.fillText(`Últimos ${recent.length} jogo${recent.length!==1?'s':''}`,CW/2,12);
    data.forEach((d,i)=>{
      const x=pad.l+gap*(i+1)+bW*i;
      const h=d.total/maxV*gH;
      ctx.fillStyle=d.color+'66';ctx.fillRect(x,pad.t+gH-h,bW,h);
      ctx.strokeStyle=d.color;ctx.lineWidth=1.5;ctx.strokeRect(x,pad.t+gH-h,bW,h);
      if(d.total>0){
        ctx.fillStyle=d.color;ctx.font='bold 10px system-ui';ctx.textAlign='center';
        ctx.fillText(d.total,x+bW/2,pad.t+gH-h-4);
      }
      const nm=shortName(d.name);
      ctx.fillStyle='#7b89b0';ctx.font='9px system-ui';ctx.textAlign='center';
      ctx.fillText(nm.length>8?nm.slice(0,7)+'…':nm,x+bW/2,CH-24);
      // mini dots por jogo
      d.pts.forEach((pt,gi)=>{
        const dc=pt>=10?'#00c853':pt>0?'#ffd600':'#ff3d57';
        ctx.beginPath();ctx.arc(x+bW/2-8+gi*4,CH-14,2.5,0,Math.PI*2);
        ctx.fillStyle=dc;ctx.fill();
      });
    });
  }

  // Force multiple redraws after mount and data changes
  useEffect(()=>{
    // On mount: try at 300ms, 800ms, 2000ms
    const t1=setTimeout(()=>setTick(x=>x+1),300);
    const t2=setTimeout(()=>setTick(x=>x+1),800);
    const t3=setTimeout(()=>setTick(x=>x+1),2000);
    return()=>{clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);};
  },[]); // Only on mount

  // Also redraw when results change
  useEffect(()=>{
    const t=setTimeout(()=>setTick(x=>x+1),200);
    return()=>clearTimeout(t);
  },[JSON.stringify(state.results)]);

  useEffect(()=>{
    const wrap=wrapRef.current;
    if(!wrap)return;
    function redraw(){
      dc('line',drawLine);dc('bars',drawBars);dc('heat',drawHeat);
      dc('dist',drawDist);dc('gap',drawGap);dc('form',drawForm);
    }
    const t1=setTimeout(redraw,50);
    const t2=setTimeout(redraw,400);
    const t3=setTimeout(redraw,1200);
    const t4=setTimeout(redraw,3000);
    // Observe both wrap and its parent for size changes
    const ro=new ResizeObserver(()=>{clearTimeout(t1);redraw();});
    ro.observe(wrap);
    if(wrap.parentElement)ro.observe(wrap.parentElement);
    // Also observe visibility
    const io=new IntersectionObserver(entries=>{
      if(entries[0]?.isIntersecting)redraw();
    },{threshold:0.1});
    io.observe(wrap);
    return()=>{ro.disconnect();io.disconnect();clearTimeout(t1);clearTimeout(t2);clearTimeout(t3);clearTimeout(t4);};
  },[ranked,gamesWithResult,hiddenPlayers,phaseFilter,tick,roundFilter,state.players.length]);

  // Charts that need horizontal scroll when many players: bars, form
  const scrollCharts=new Set(['bars','form','heat','dist']);
  const minBarWidth=52; // px per player
  const minChartWidth=ranked.length*minBarWidth+80;

  function handleMouseMove(key,e){
    const canvas=refs[key]?.current;
    if(!canvas)return;
    const rect=canvas.getBoundingClientRect();
    const scaleX=canvas.width/(window.devicePixelRatio||1)/rect.width;
    const x=(e.clientX-rect.left)*scaleX;
    const y=(e.clientY-rect.top)*(canvas.height/(window.devicePixelRatio||1)/rect.height);
    const regions=hoverDataRef.current[key]||[];
    const hit=regions.find(r=>x>=r.x&&x<=r.x+r.w&&y>=r.y&&y<=r.y+r.h);
    if(hit)setTooltip({x:e.clientX,y:e.clientY,title:hit.title||'',lines:hit.lines||[]});
    else setTooltip(null);
  }

  const card=(title,sub,key)=>(
    <div className="card" style={{marginBottom:'1rem'}}>
      <div style={{marginBottom:'.5rem'}}>
        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontWeight:700,fontSize:'1rem',textTransform:'uppercase',letterSpacing:1,color:'#fff'}}>{title}</div>
        {sub&&<div style={{fontSize:10,color:'var(--muted)',marginTop:1}}>{sub}</div>}
      </div>
      <div style={{background:'#0d1220',borderRadius:8,overflowX:scrollCharts.has(key)?'auto':'hidden',overflowY:'hidden',scrollbarWidth:'thin',scrollbarColor:'#2a3560 #0d1220'}}>
        <div style={{minWidth:scrollCharts.has(key)?minChartWidth+'px':'100%'}}>
          <canvas ref={refs[key]} style={{display:'block',width:'100%'}}
            onMouseMove={e=>handleMouseMove(key,e)}
            onMouseLeave={()=>setTooltip(null)}/>
        </div>
      </div>
      {scrollCharts.has(key)&&ranked.length>8&&<div style={{fontSize:9,color:'#2a3560',textAlign:'right',marginTop:2,paddingRight:4}}>← deslize →</div>}
    </div>
  );

  return(
    <div ref={wrapRef} style={{position:'relative'}}>
      {tooltip&&(
        <div style={{position:'fixed',left:Math.min(tooltip.x+14,window.innerWidth-220),top:Math.max(8,tooltip.y-tooltip.lines.length*20-40),background:'#0d1220',border:'1px solid #3a4570',borderRadius:10,padding:'8px 12px',fontSize:12,color:'#fff',pointerEvents:'none',zIndex:999,boxShadow:'0 8px 24px #000a',minWidth:160}}>
          <div style={{fontWeight:700,fontSize:11,color:'#7b89b0',marginBottom:5,letterSpacing:.3}}>{tooltip.title}</div>
          {tooltip.lines.map((l,i)=>(
            <div key={i} style={{display:'flex',alignItems:'center',gap:6,marginBottom:3}}>
              <span style={{display:'inline-block',width:8,height:8,borderRadius:'50%',background:l.color,flexShrink:0}}/>
              <span style={{color:'#c8d0e0',fontSize:11}}>{l.name}</span>
              <span style={{marginLeft:'auto',fontFamily:"'Bebas Neue',sans-serif",fontSize:13,color:l.color,paddingLeft:8}}>{l.value}</span>
            </div>
          ))}
        </div>
      )}
      <h1 style={{marginBottom:'1rem'}}>Gráficos</h1>

      {/* Stats cards */}
      <div style={{display:'grid',gridTemplateColumns:'repeat(5,1fr)',gap:8,marginBottom:'1.25rem'}}>
        {[
          {label:'Jogos Restantes',val:remaining,color:'var(--yellow)'},
          {label:'Jogos Pontuados',val:scored,color:'var(--green)'},
          {label:'Pts em Disputa',val:ptsLeft,color:'#64b5f6'},
          {label:'Pts Disputados',val:ptsDone,color:'var(--muted)'},
          {label:'% Concluído',val:pct+'%',color:'var(--yellow)'},
        ].map(({label,val,color})=>(
          <div key={label} style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:10,padding:'.7rem .5rem',textAlign:'center'}}>
            <div style={{fontFamily:"'Bebas Neue',sans-serif",fontSize:'1.7rem',color,lineHeight:1}}>{val}</div>
            <div style={{fontSize:8,color:'var(--muted)',marginTop:3,fontWeight:700,textTransform:'uppercase',letterSpacing:.4,lineHeight:1.3}}>{label}</div>
          </div>
        ))}
      </div>

      {/* Filtro de fase */}
      <div style={{display:'flex',gap:6,marginBottom:'1rem',flexWrap:'wrap'}}>
        {[['all','🌐 Todos'],['group','⚽ Grupos'],['knockout','⚔️ Mata-Mata']].map(([val,label])=>(
          <button key={val} onClick={()=>setPhaseFilter(val)}
            style={{padding:'5px 14px',borderRadius:20,border:`1px solid ${phaseFilter===val?'var(--yellow)':'var(--border)'}`,background:phaseFilter===val?'#ffd60022':'var(--surface3)',color:phaseFilter===val?'var(--yellow)':'var(--muted)',fontSize:11,fontWeight:700,cursor:'pointer',transition:'all .15s',letterSpacing:.3}}>
            {label}
          </button>
        ))}
      </div>

      {/* Filtro de jogadores */}
      <div style={{background:'var(--surface2)',border:'1px solid var(--border)',borderRadius:10,padding:'.75rem 1rem',marginBottom:'1rem'}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:8}}>
          <span style={{fontSize:11,color:'#fff',fontWeight:700,textTransform:'uppercase',letterSpacing:.5}}>👥 Jogadores nos Gráficos</span>
          <div style={{display:'flex',gap:6}}>
            <button onClick={()=>setHiddenPlayers(new Set())}
              style={{background:'#00c85322',border:'1px solid #00c85344',borderRadius:6,padding:'3px 10px',fontSize:10,color:'var(--green)',fontWeight:700,cursor:'pointer'}}>
              ✓ Todos
            </button>
            <button onClick={()=>setHiddenPlayers(new Set(allRanked.map(p=>p.id)))}
              style={{background:'#ff3d5722',border:'1px solid #ff3d5744',borderRadius:6,padding:'3px 10px',fontSize:10,color:'var(--red)',fontWeight:700,cursor:'pointer'}}>
              ✕ Nenhum
            </button>
          </div>
        </div>
        <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
          {allRanked.map(p=>{
            const hidden=hiddenPlayers.has(p.id);
            return(
              <button key={p.id} onClick={()=>togglePlayer(p.id)}
                style={{display:'flex',alignItems:'center',gap:5,padding:'5px 12px',borderRadius:20,border:`1px solid ${hidden?'var(--border)':p.color+'88'}`,background:hidden?'var(--surface3)':p.color+'18',cursor:'pointer',transition:'all .15s'}}>
                <span style={{display:'inline-block',width:10,height:10,borderRadius:'50%',background:hidden?'#3a4570':p.color,flexShrink:0}}/>
                <span style={{fontSize:12,color:hidden?'var(--muted)':p.color,fontWeight:hidden?400:600}}>{shortName(p.name)}</span>
                {hidden&&<span style={{fontSize:10,color:'#ff3d57',marginLeft:2}}>✕</span>}
              </button>
            );
          })}
        </div>
        {hiddenPlayers.size>0&&<div style={{fontSize:10,color:'var(--muted)',marginTop:6}}>{allRanked.length-hiddenPlayers.size} de {allRanked.length} jogadores visíveis</div>}
      </div>

      {/* Toggle por jogo / por rodada */}
      <div style={{display:'flex',gap:5,marginBottom:'.5rem'}}>
        {[['game','⚽ Por Jogo'],['round','📅 Por Rodada']].map(([val,label])=>(
          <button key={val} onClick={()=>setRoundFilter(val)}
            style={{padding:'3px 12px',borderRadius:20,border:'1px solid '+(roundFilter===val?'var(--yellow)':'var(--border)'),background:roundFilter===val?'#ffd60022':'var(--surface3)',color:roundFilter===val?'var(--yellow)':'var(--muted)',fontSize:10,fontWeight:700,cursor:'pointer'}}>
            {label}
          </button>
        ))}
      </div>
      {card('Evolução por Jogo','Pontuação acumulada de cada participante','line')}
      {card('Acertos por Jogador','Verde = cravadas · Amarelo = resultados','bars')}
      {card('Mapa de Calor','Verde = cravada · Amarelo = resultado · Vermelho = errou','heat')}
      {card('Distribuição de Palpites','Palpites do último jogo com resultado','dist')}
      {card('Distância para o Líder','Quantos pontos cada um está atrás do 1º','gap')}
      {card('Forma Recente','Pontos nos últimos 5 jogos com mini-histórico','form')}
    </div>
  );
}


function GameCard({game,state,isAdmin,isGolden,lockTime,now,fmtDate,fmtCountdown}){
  const res=state.results?.[game.id];
  const isLockedG=isFinite(lockTime)&&now>=(lockTime);
  const msToLock=lockTime-now;
  const isKO=(state.knockoutGames||[]).some(kg=>kg.id===game.id);
  const hasResult=res&&res.home!==''&&res.home!==undefined&&!isNaN(parseInt(res.home));
  const borderColor=isGolden?'#ffd600':isLockedG&&!hasResult?'#ff980044':isLockedG&&hasResult?'#2a3560':'#1e88e533';
  const bgColor=isGolden?'#ffd60008':isLockedG&&!hasResult?'#ff980008':isLockedG&&hasResult?'var(--surface2)':'#1e88e508';
  return(
    <div style={{background:bgColor,border:`1px solid ${borderColor}`,borderRadius:10,padding:'.75rem 1rem',marginBottom:8,transition:'all .3s'}}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:'.5rem'}}>
        <div>
          <span style={{fontWeight:700,fontSize:14,color:isGolden?'#ffd600':'#fff'}}>
            {game.home} × {game.away}
          </span>
          {isKO&&<span className="badge badge-yellow" style={{marginLeft:6,fontSize:9}}>{(()=>{const ph=(state.knockoutGames||[]).find(g=>g.id===game.id)?.phase;return ph==='LIB'?'Libertadores':ph==='SUL'?'Sul-Americana':ph==='TEST'?'Teste':'Mata-Mata';})()}</span>}
        </div>
        <div style={{textAlign:'right',flexShrink:0,marginLeft:8}}>
          <div style={{fontSize:11,color:'var(--muted)'}}>{fmtDate(game)}</div>
          {res&&res.home!==''&&<div style={{fontFamily:"'Bebas Neue'",fontSize:15,color:'var(--green)'}}>{res.home} × {res.away}</div>}
          {!isLockedG&&isGolden&&msToLock>0&&(
            <div style={{fontSize:11,fontWeight:700,color:'#ffd600',fontFamily:"'Bebas Neue'",letterSpacing:1}}>🔒 {fmtCountdown(msToLock)}</div>
          )}
          {isLockedG&&(!res||res.home==='')&&<div style={{fontSize:10,color:'var(--red)',fontWeight:700}}>🔒 Encerrado</div>}
        </div>
      </div>
      <div style={{display:'flex',flexWrap:'wrap',gap:5}}>
        {state.players.map(p=>{
          const pick=(state.picks?.[p.id]||{})[game.id];
          const hasPick=pick?.home!==undefined&&pick?.away!==undefined&&pick.home!==''&&pick.away!==''&&!isNaN(parseInt(pick.home));
          const pts=(isLockedG||isAdmin)&&hasPick&&res&&res.home!==''?calcPoints(pick,res,state.config,isKO):null;
          const chipBg=pts!==null?(pts>=10?'#00c85318':pts>0?'#ffd60018':'#ff3d5718'):hasPick&&(isLockedG||isAdmin)?'#1c2540':'var(--surface3)';
          const chipBorder=pts!==null?(pts>=10?'#00c85355':pts>0?'#ffd60055':'#ff3d5755'):hasPick&&(isLockedG||isAdmin)?'#3a4570':'var(--border)';
          const scoreColor=pts!==null?(pts>=10?'#00c853':pts>0?'#ffd600':'#ff3d57'):hasPick&&(isLockedG||isAdmin)?'var(--yellow)':'var(--muted)';
          return(
            <div key={p.id} style={{background:chipBg,border:`1px solid ${chipBorder}`,borderRadius:7,padding:'4px 10px',display:'flex',alignItems:'center',gap:5}}>
              <span style={{fontSize:10,color:'var(--muted)'}}>{shortName(p.name)}</span>
              {(isLockedG||isAdmin)
                ?<span style={{fontFamily:"'Bebas Neue'",fontSize:13,color:hasPick?scoreColor:'var(--surface3)'}}>
                  {hasPick&&pick.home!==''&&pick.away!==''?`${pick.home}×${pick.away}`:'–'}
                  {pts!==null&&<span style={{fontSize:9}}> ({pts}pts)</span>}
                </span>
                :<span style={{fontSize:11,color:hasPick?'#00c853':'var(--surface3)'}}>{hasPick?'✓':'–'}</span>
              }
            </div>
          );
        })}
      </div>
    </div>
  );
}

function ProximosJogos({state,session}){
  const lockMin=state.config?.lockBefore||60;
  const [serverNow,setServerNow]=React.useState(Date.now());
  const [timerTick,setTimerTick]=React.useState(0);

  useEffect(()=>{
    fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`,{
      headers:{'Authorization':`Bearer ${GITHUB_TOKEN}`,'Accept':'application/vnd.github+json'}
    }).then(r=>{
      const d=r.headers.get('Date');
      if(d) setServerNow(new Date(d).getTime());
    }).catch(()=>{});
    const iv=setInterval(()=>setTimerTick(t=>t+1),1000);
    return()=>clearInterval(iv);
  },[]);

  const now=serverNow+timerTick*1000;

  const allGames=[...GROUP_GAMES,...(state.knockoutGames||[])]
    .filter(g=>g.home&&g.away&&g.date&&g.time)
    .sort((a,b)=>new Date(`${a.date}T${a.time}:00-03:00`)-new Date(`${b.date}T${b.time}:00-03:00`));

  function gameTime(g){return new Date(`${g.date}T${g.time}:00-03:00`).getTime();}
  function lockTimeF(g){return gameTime(g)-lockMin*60000;}
  function isLockedNow(g){return now>=lockTimeF(g);}

  const nextUnlocked=allGames.find(g=>!isLockedNow(g));
  const nextLockTime=nextUnlocked?lockTimeF(nextUnlocked):null;

  const in24h=allGames.filter(g=>!isLockedNow(g)&&lockTimeF(g)-now<=24*3600*1000);
  const goldenIds=new Set(
    in24h.length>0 ? in24h.map(g=>g.id) : (nextUnlocked?[nextUnlocked.id]:[])
  );

  function fmtCountdown(ms){
    if(ms<=0)return'00:00:00';
    const h=Math.floor(ms/3600000);
    const m=Math.floor((ms%3600000)/60000);
    const s=Math.floor((ms%60000)/1000);
    return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  function fmtDate(g){
    if(!g.date)return'';
    return g.date.slice(8)+'/'+g.date.slice(5,7)+' '+g.time;
  }

  const isAdmin=session?.type==='admin';
  const upcoming=allGames.filter(g=>!isLockedNow(g));
  const lockedGames=[...allGames].filter(g=>isLockedNow(g)).reverse();

  return(
    <div>
      <div className="flex-between" style={{marginBottom:'1rem',flexWrap:'wrap',gap:8}}>
        <h1>Jogos</h1>
        <span className="badge badge-green">💰 R$ {(state.players.length*50).toLocaleString('pt-BR')} no pote</span>
      </div>

      <div style={{position:'sticky',top:'var(--header-h,56px)',zIndex:90,background:'#0d1220ee',backdropFilter:'blur(8px)',borderBottom:'1px solid #2a3560',marginBottom:'1rem',marginLeft:'-1.25rem',marginRight:'-1.25rem'}}>
        {nextLockTime&&(
          <div style={{padding:'.5rem 1.25rem',display:'flex',alignItems:'center',justifyContent:'space-between',gap:8,borderBottom:'1px solid #ffd60022'}}>
            <span style={{fontSize:12,color:'var(--muted)'}}>🔒 Próximo fechamento em:</span>
            <span style={{fontFamily:"'Bebas Neue'",fontSize:'1.4rem',color:'#ffd600',letterSpacing:2}}>
              {fmtCountdown(nextLockTime-now)}
            </span>
          </div>
        )}
        <div style={{display:'flex',gap:5,padding:'.4rem 1.25rem'}}>
          {[['#sec-andamento','⚽ Andamento','#ff9800'],['#sec-proximos','⏳ Próximos','#64b5f6'],['#sec-encerrados','✅ Encerrados','#00c853']].map(([href,label,color])=>(
            <a key={href} href={href}
              onClick={e=>{e.preventDefault();document.querySelector(href)?.scrollIntoView({behavior:'smooth',block:'start'});}}
              style={{fontSize:10,fontWeight:700,color,textDecoration:'none',padding:'3px 10px',borderRadius:20,border:'1px solid '+color+'55',background:color+'11',letterSpacing:.3,transition:'all .15s',whiteSpace:'nowrap'}}>
              {label}
            </a>
          ))}
        </div>
      </div>

      {(()=>{
        const inProgress=lockedGames.filter(g=>!state.results?.[g.id]||state.results[g.id].home===''||state.results[g.id].home===undefined);
        const finished=lockedGames.filter(g=>state.results?.[g.id]&&state.results[g.id].home!==''&&state.results[g.id].home!==undefined&&!isNaN(parseInt(state.results[g.id].home)));
        return(
          <>
            {inProgress.length>0&&(
              <div id="sec-andamento" style={{marginBottom:'1.5rem'}}>
                <div className="group-header" style={{marginBottom:'.75rem',borderLeftColor:'#ff9800'}}>
                  <h2 style={{fontSize:'.9rem',color:'#ff9800'}}>⚽ Em Andamento — aguardando resultado</h2>
                </div>
                {inProgress.map(g=><GameCard key={g.id} game={g} state={state} isAdmin={isAdmin} isGolden={false} lockTime={lockTimeF(g)} now={now} fmtDate={fmtDate} fmtCountdown={fmtCountdown}/>)}
              </div>
            )}
            {upcoming.length>0&&(
              <div id="sec-proximos" style={{marginBottom:'1.5rem'}}>
                <div className="group-header" style={{marginBottom:'.75rem',borderLeftColor:'#1e88e5'}}>
                  <h2 style={{fontSize:'.9rem',color:'#64b5f6'}}>⏳ Próximos Jogos</h2>
                </div>
                {upcoming.map(g=><GameCard key={g.id} game={g} state={state} isAdmin={isAdmin} isGolden={goldenIds.has(g.id)} lockTime={lockTimeF(g)} now={now} fmtDate={fmtDate} fmtCountdown={fmtCountdown}/>)}
              </div>
            )}
            {finished.length>0&&(
              <div id="sec-encerrados">
                <div className="group-header" style={{marginBottom:'.75rem',borderLeftColor:'#00c853'}}>
                  <h2 style={{fontSize:'.9rem',color:'#00c853'}}>✅ Encerrados — palpites revelados</h2>
                </div>
                {finished.map(g=><GameCard key={g.id} game={g} state={state} isAdmin={isAdmin} isGolden={false} lockTime={lockTimeF(g)} now={now} fmtDate={fmtDate} fmtCountdown={fmtCountdown}/>)}
              </div>
            )}
          </>
        );
      })()}

      {upcoming.length===0&&lockedGames.length===0&&(

}

function computeDetailedScores(state){
  const{players,picks,results,config,knockoutGames=[]}=state;
  const detailed={};
  players.forEach(p=>{
    let exact=0,onlyWinner=0,bonusPts=0;
    let exactPts=0,owPts=0;
    const processGame=(g,isKO)=>{
      const res=results[g.id];
      const pick=(picks[p.id]||{})[g.id];
      if(!res||!pick)return;
      const ph=parseInt(pick.home),pa=parseInt(pick.away);
      const rh=parseInt(res.home),ra=parseInt(res.away);
      if(isNaN(ph)||isNaN(pa)||isNaN(rh)||isNaN(ra))return;
      const exactVal=config?.exactScore||10;
      const winnerVal=config?.onlyWinner||5;
      const pw=ph>pa?'H':ph<pa?'A':'D';
      const rw=rh>ra?'H':rh<ra?'A':'D';
      if(ph===rh&&pa===ra){exact++;exactPts+=exactVal;return;}
      if(pw!==rw)return;
      onlyWinner++;owPts+=winnerVal;
    };
    GROUP_GAMES.forEach(g=>processGame(g,false));
    knockoutGames.forEach(g=>processGame(g,true));
    function matchA(pick,finalVal){
      if(!pick||!finalVal)return false;
      const aliases=finalVal.split(',').map(x=>x.trim().toLowerCase()).filter(Boolean);
      return aliases.includes(pick.trim().toLowerCase());
    }
    if(matchA(p.topScorer,state.finalTopScorer))bonusPts+=config.topScorer;
    const bp=p.bonusPicks||{};
    if(matchA(bp.champion,state.finalChampion))bonusPts+=config.champion;
    if(matchA(bp.runnerUp,state.finalRunnerUp))bonusPts+=config.runnerUp;
    if(matchA(bp.third,state.finalThird))bonusPts+=config.third;
    const total=exactPts+owPts+bonusPts;
    detailed[p.id]={total,exact,exactPts,onlyWinner,owPts,bonusPts};
  });
  return detailed;
}

  function matchA(pick,finalVal){
    if(!pick||!finalVal)return false;

  }
  const ranked=state.players.map(p=>({...p,...detailed[p.id]||{total:0,exact:0,onlyWinner:0,bonusPts:0}})).sort((a,b)=>{
    if(b.total!==a.total)return b.total-a.total;
    if(b.exact!==a.exact)return b.exact-a.exact;
    if(b.onlyWinner!==a.onlyWinner)return b.onlyWinner-a.onlyWinner;
    const aChamp=matchA((a.bonusPicks||{}).champion,state.finalChampion)?1:0;
    const bChamp=matchA((b.bonusPicks||{}).champion,state.finalChampion)?1:0;
    if(bChamp!==aChamp)return bChamp-aChamp;

    const bRu=matchA((b.bonusPicks||{}).runnerUp,state.finalRunnerUp)?1:0;

function PlayerView({state,setState,onSave,saving,playerId}){
  const player=state.players.find(p=>p.id===playerId);
  if(!player)return<div className="empty"><div className="empty-icon">👤</div><p>Jogador não encontrado</p></div>;
  const[tab,setTab]=useState('group');
  const[dirty,setDirty]=useState(false);
  const[serverNow,setServerNow]=useState(Date.now());
  const[timerTick,setTimerTick]=useState(0);
  const myPicks=state.picks[playerId]||{};

  useEffect(()=>{
    fetch(`https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}`,{
      headers:{'Authorization':`Bearer ${GITHUB_TOKEN}`,'Accept':'application/vnd.github+json'}
    }).then(r=>{const d=r.headers.get('Date');if(d)setServerNow(new Date(d).getTime());}).catch(()=>{});
    const iv=setInterval(()=>setTimerTick(t=>t+1),1000);
    return()=>clearInterval(iv);
  },[]);

  const now=serverNow+timerTick*1000;
  const lockMin=state.config?.lockBefore||60;

  function lockTime(g){
    if(!g.date||!g.time)return Infinity;
    const dt=new Date(`${g.date}T${g.time}:00-03:00`);
    if(isNaN(dt.getTime()))return Infinity;
    return dt.getTime()-lockMin*60000;
  }
  function isLockedNowP(g){if(!g.date||!g.time)return false;const lt=lockTime(g);if(isNaN(lt))return false;return now>=lt;}

  function fmtCountdownP(ms){
    if(ms<=0)return'00:00:00';
    const h=Math.floor(ms/3600000);
    const m=Math.floor((ms%3600000)/60000);
    const s=Math.floor((ms%60000)/1000);
    return`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  }

  const allGamesP=[...GROUP_GAMES,...(state.knockoutGames||[])].filter(g=>g.date&&g.time);
  const nextUnlockedP=allGamesP.filter(g=>!isLockedNowP(g)).sort((a,b)=>lockTime(a)-lockTime(b))[0];
  const nextLockTimeP=nextUnlockedP?lockTime(nextUnlockedP):null;
  const in24hP=allGamesP.filter(g=>!isLockedNowP(g)&&lockTime(g)-now<=24*3600*1000);
  const goldenIdsP=new Set(in24hP.length>0?in24hP.map(g=>g.id):(nextUnlockedP?[nextUnlockedP.id]:[]));
  const scores=computeScores(state);
  const myScore=scores[playerId]?.total||0;
  const rank=Object.values(scores).filter(s=>s.total>myScore).length+1;
  const bp=player.bonusPicks||{};

  function updatePick(gid,pick){
    setState(s=>({...s,picks:{...s.picks,[playerId]:{...(s.picks[playerId]||{}),[gid]:pick}}}));
    setDirty(true);
  }
  function updateBonus(key,val){
    setState(s=>({...s,players:s.players.map(p=>p.id===playerId?{...p,bonusPicks:{...(p.bonusPicks||{}),[key]:val}}:p)}));
    setDirty(true);
  }

  return(
    <div>
      <div style={{marginBottom:'1rem'}}>
        <h1 style={{fontSize:'1.3rem'}}>Olá, {shortName(player.name)}!</h1>
        <p style={{color:'var(--muted)',fontSize:11,marginBottom:'.75rem'}}>Bolão do Vini · Copa 2026</p>
        {(()=>{
          const det=computeDetailedScores(state);
          const myDet=det[playerId]||{exact:0,onlyWinner:0};
          const allRanked=state.players.map(p=>({...p,...det[p.id]||{total:0}})).sort((a,b)=>b.total-a.total);
          const myRankIdx=allRanked.findIndex(p=>p.id===playerId);

          <span style={{fontFamily:"'Bebas Neue'",fontSize:'1.4rem',color:'#ffd600',letterSpacing:2}}>
            {fmtCountdownP(nextLockTimeP-now)}

      )}
      {/* Âncoras de seção */}
      <div style={{display:'flex',gap:5,marginBottom:'.75rem',flexWrap:'wrap'}}>

        ))}
      </div>
      {tab==='group'&&(

          {(()=>{
            const inProg=[],upcoming=[],finished=[];
            GROUPS.forEach(g=>{
              const games=GROUP_GAMES.filter(gm=>gm.group===g);
              if(!games.length)return;
              const anyLocked=games.some(gm=>isLockedNowP(gm));
              const anyResult=games.some(gm=>{const r=state.results?.[gm.id];return r&&r.home!==''&&!isNaN(parseInt(r.home));});
              const anyOpen=games.some(gm=>!isLockedNowP(gm));
              if(anyLocked&&!anyResult)inProg.push(g);
              else if(anyResult&&!anyOpen)finished.push(g);
              else upcoming.push(g);
            });
            function renderG(g){
              const games=GROUP_GAMES.filter(gm=>gm.group===g);
              return(
                <div key={g} style={{marginBottom:'1rem'}}>
                  <div className="group-header"><h2 style={{fontSize:'.85rem'}}>{g==='LIB'?'🏆 Libertadores (Teste)':g==='SUL'?'🏆 Sul-Americana (Teste)':`Grupo ${g}`}</h2></div>
                  {games.map(gm=>{
                    const isGoldenM=goldenIdsP.has(gm.id);
                    const msToLockM=lockTime(gm)-now;
                    const lockedM=isLockedNowP(gm);
                    return(
                      <div key={gm.id} style={{border:isGoldenM?'1px solid #ffd60066':'1px solid transparent',borderRadius:11,marginBottom:lockedM?0:isGoldenM?4:0}}>
                        {isGoldenM&&!lockedM&&msToLockM>0&&(
                          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'2px 8px 0',fontSize:10}}>
                            <span style={{color:'#ffd600',fontWeight:700,letterSpacing:.5}}>⚡ Fecha em breve</span>
                            <span style={{fontFamily:"'Bebas Neue'",fontSize:13,color:'#ffd600',letterSpacing:1}}>{fmtCountdownP(msToLockM)}</span>
                          </div>
                        )}
                        <MatchRow game={gm} pick={myPicks[gm.id]} onPick={pick=>updatePick(gm.id,pick)}
                          locked={lockedM} result={state.results[gm.id]} isKnockout={false} isGolden={isGoldenM}/>
                      </div>
                    );
                  })}
                </div>
              );
            }
            return(
              <>
                {inProg.length>0&&<div id="pp-andamento" style={{marginBottom:'1.5rem'}}>
                  <div className="group-header" style={{borderLeftColor:'#ff9800',marginBottom:'.5rem'}}><h2 style={{fontSize:'.9rem',color:'#ff9800'}}>⚽ Em Andamento</h2></div>
                  {inProg.map(renderG)}
                </div>}
                {upcoming.length>0&&<div id="pp-proximos" style={{marginBottom:'1.5rem'}}>
                  <div className="group-header" style={{borderLeftColor:'#64b5f6',marginBottom:'.5rem'}}><h2 style={{fontSize:'.9rem',color:'#64b5f6'}}>⏳ Próximos — abertos para palpitar</h2></div>
                  {upcoming.map(renderG)}
                </div>}
                {finished.length>0&&<div id="pp-finalizados" style={{marginBottom:'1.5rem'}}>
                  <div className="group-header" style={{borderLeftColor:'#00c853',marginBottom:'.5rem'}}><h2 style={{fontSize:'.9rem',color:'#00c853'}}>✅ Finalizados</h2></div>
                  {finished.map(renderG)}
                </div>}
              </>
            );
          })()}
        </div>
      )}
      {tab==='knockout'&&(
        <div className="scrollable">
          {(!state.knockoutGames||!state.knockoutGames.length)?
            <div className="empty"><div className="empty-icon">⏳</div><p>Mata-mata ainda não configurado.</p></div>:
            KNOCKOUT_TEMPLATE.map(ph=>{
              const games=(state.knockoutGames||[]).filter(g=>g.phase===ph.phase&&g.home&&g.away);
              if(!games.length)return null;
              return(
                <div key={ph.phase} style={{marginBottom:'1rem'}}>
                  <div className="group-header"><h2 style={{fontSize:'.85rem'}}>{ph.label}</h2></div>
                  {games.map(gm=>{
                    const isGoldenM=goldenIdsP.has(gm.id);
                    const msToLockM=lockTime(gm)-now;
                    const lockedM=isLockedNowP(gm);
                    return(
                      <div key={gm.id} style={{border:isGoldenM?'1px solid #ffd60066':'1px solid transparent',borderRadius:11,marginBottom:isGoldenM?4:0}}>
                        {isGoldenM&&!lockedM&&msToLockM>0&&(
                          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'2px 8px 0',fontSize:10}}>
                            <span style={{color:'#ffd600',fontWeight:700,letterSpacing:.5}}>⚡ Fecha em breve</span>
                            <span style={{fontFamily:"'Bebas Neue'",fontSize:13,color:'#ffd600',letterSpacing:1}}>{fmtCountdownP(msToLockM)}</span>
                          </div>
                        )}
                        <MatchRow game={gm} pick={myPicks[gm.id]} onPick={pick=>updatePick(gm.id,pick)}
                          locked={lockedM} result={state.results[gm.id]} isKnockout={true} isGolden={isGoldenM}/>
                      </div>
                    );
                  })}
                </div>
              );
            })
          }
        </div>
      )}
    </div>
  );
}

function AdminView({state,setState,onSave,saving}){
  const[tab,setTab]=useState('players');
  const[newName,setNewName]=useState('');
  const[newUsername,setNewUsername]=useState('');
  const[newEmail,setNewEmail]=useState('');
  const[newPass,setNewPass]=useState('');
  const baseUrl=window.location.origin+window.location.pathname;

  function addPlayer(){
    if(!newName.trim()||!newUsername.trim()||!newPass.trim())return alert('Preencha nome, usuário e senha!');
    const id=genId();
    setState(s=>({...s,players:[...s.players,{id,name:newName.trim(),username:newUsername.trim().toLowerCase(),email:newEmail.trim(),password:newPass.trim(),bonusPicks:{},topScorer:''}]}));
    setNewName('');setNewUsername('');setNewEmail('');setNewPass('');
  }
  function removePlayer(id){
    if(!confirm('Remover participante?'))return;
    setState(s=>({...s,players:s.players.filter(p=>p.id!==id)}));
  }
  function updateResult(gid,side,val){
    setState(s=>({...s,results:{...s.results,[gid]:{...(s.results?.[gid]||{}),[side]:val}}}));
  }
  function updateKO(gid,field,val){
    setState(s=>({...s,knockoutGames:(s.knockoutGames||[]).map(g=>g.id===gid?{...g,[field]:val}:g)}));
  }
  function initKnockout(){
    let id=100;
    const games=KNOCKOUT_TEMPLATE.flatMap(ph=>Array.from({length:ph.count},()=>({id:id++,phase:ph.phase,label:'',home:'',away:'',date:'',time:'',city:''})));
    setState(s=>({...s,knockoutGames:games}));
  }

  return(
    <div>
      <div className="flex-between" style={{marginBottom:'1rem',flexWrap:'wrap',gap:8}}>

        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-ghost" onClick={()=>{
            const dt=new Date().toISOString().slice(0,10);

            const jblob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
            const ja=document.createElement('a');ja.href=URL.createObjectURL(jblob);

            // HTML visual
            setTimeout(()=>{
              const det=computeDetailedScores(state);

              const pot=state.players.length*50;
              const now=new Date().toLocaleString('pt-BR',{timeZone:'America/Sao_Paulo'});
              const allGames=[...GROUP_GAMES,...(state.knockoutGames||[])];
              let html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8">
<title>Backup Bolão do Vini — ${dt}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#0a0e1a;color:#e8ecf4;padding:1.5rem}
h1{font-size:1.8rem;color:#ffd600;margin-bottom:.25rem}
h2{font-size:1.1rem;color:#ffd600;margin:1.5rem 0 .5rem;border-bottom:1px solid #2a3560;padding-bottom:.4rem}
h3{font-size:.9rem;color:#64b5f6;margin:.75rem 0 .3rem}
.meta{color:#7b89b0;font-size:12px;margin-bottom:1.5rem}
table{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:1rem}

<h1>⚽ Bolão do Vini — Backup</h1>
<div class="meta">Gerado em: ${now} &nbsp;|&nbsp; ${state.players.length} participantes &nbsp;|&nbsp; Pote: R$ ${pot}</div>`;

              // RANKING
              html+=`<div class="section"><h2>🏆 Ranking</h2><table><tr><th>#</th><th>Jogador</th><th>Pontos</th><th>Cravadas</th><th>Resultados</th><th>Bônus</th><th>Campeão</th><th>Vice</th><th>3º</th><th>Artilheiro</th></tr>`;
              ranked.forEach((p,i)=>{
