<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bolão do Vini — Copa 2026</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Barlow',sans-serif;background:#0a0e1a;color:#e8ecf4;min-height:100vh}
:root{--green:#00d400;--yellow:#ffd700;--red:#ff3d57;--blue:#1e88e5;--surface:#131929;--surface2:#1c2540;--surface3:#232d4f;--border:#2a3560;--text:#e8ecf4;--muted:#7b89b0}
.app{display:flex;flex-direction:column;min-height:100vh}
.header{background:#0d1220;border-bottom:1px solid var(--border);padding:0 1rem;position:sticky;top:0;z-index:100}
.header-inner{display:flex;align-items:center;justify-content:space-between;max-width:1200px;margin:0 auto;min-height:56px;flex-wrap:wrap;gap:4px;padding:.3rem 0}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.5rem;letter-spacing:3px;background:linear-gradient(90deg,var(--yellow),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.nav{display:flex;gap:3px;flex-wrap:wrap;overflow-x:auto}
.nav-btn{background:none;border:none;color:var(--muted);font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;padding:5px 10px;border-radius:20px;cursor:pointer;transition:all .15s;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
.nav-btn:hover{color:var(--text);background:var(--surface2)}
.nav-btn.active{color:#0a0e1a;background:var(--yellow)}
.content{flex:1;padding:1.25rem;max-width:1200px;margin:0 auto;width:100%}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:1.25rem;margin-bottom:1rem}
.card-dark{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:1rem;margin-bottom:8px}
h1{font-family:'Bebas Neue',sans-serif;letter-spacing:2px;font-size:1.8rem;color:#fff}
h2{font-family:'Barlow Condensed',sans-serif;font-size:1.1rem;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:#fff}
.badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
.badge-green{background:#00d40022;color:var(--green);border:1px solid #00d40044}
.badge-yellow{background:#ffd70022;color:var(--yellow);border:1px solid #ffd70044}
.badge-red{background:#ff3d5722;color:var(--red);border:1px solid #ff3d5744}
.badge-blue{background:#1e88e522;color:#64b5f6;border:1px solid #1e88e544}
input,select,textarea{background:var(--surface2);border:1px solid var(--border);color:var(--text);padding:8px 12px;border-radius:8px;font-family:'Barlow',sans-serif;font-size:14px;outline:none;transition:border .2s}
input:focus,select:focus{border-color:var(--yellow)}
input::placeholder,textarea::placeholder{color:var(--muted)}
input[type=number]{-moz-appearance:textfield}
input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none}
.btn{padding:9px 18px;border-radius:8px;font-family:'Barlow',sans-serif;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer;border:none;transition:all .15s;width:auto}
.btn-primary{background:var(--yellow);color:#0a0e1a}.btn-primary:hover{background:#ffe033}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}.btn-ghost:hover{color:var(--text);border-color:#4a5580}
.btn-green{background:var(--green);color:#0a0e1a}.btn-green:hover{background:#2bda6a}
.btn-danger{background:#ff3d5733;color:var(--red);border:1px solid #ff3d5744}.btn-danger:hover{background:var(--red);color:#fff}
.btn-sm{padding:5px 12px;font-size:11px}
.flex{display:flex;align-items:center}
.flex-between{display:flex;align-items:center;justify-content:space-between}
.flex-col{display:flex;flex-direction:column}
.gap-sm{gap:6px}.gap-md{gap:10px}.gap-lg{gap:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.stat-card{background:var(--surface2);border-radius:10px;padding:.9rem 1rem;border:1px solid var(--border);text-align:center}
.stat-val{font-family:'Bebas Neue',sans-serif;font-size:2rem;color:#fff;line-height:1}
.stat-label{font-size:10px;color:var(--muted);font-weight:600;letter-spacing:.5px;text-transform:uppercase;margin-top:4px}
.match-row{display:flex;align-items:center;background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.6rem .8rem;gap:8px;margin-bottom:5px;transition:border .15s}
.match-row:hover{border-color:#3a4570}
.match-num{font-family:'Bebas Neue',sans-serif;font-size:.95rem;color:var(--muted);min-width:24px;flex-shrink:0}
.team-name{font-weight:600;font-size:12px;flex:1;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.team-name.right{text-align:left}
.score-box{width:38px;text-align:center;padding:4px 2px;font-size:14px;font-weight:700;font-family:'Bebas Neue',sans-serif;flex-shrink:0}
.vs{color:var(--muted);font-size:9px;font-weight:700;letter-spacing:1px;flex-shrink:0}
.match-meta{font-size:9px;color:var(--muted);flex-shrink:0;text-align:right;min-width:60px}
.ranking-row{display:flex;align-items:center;gap:10px;padding:.65rem .9rem;background:var(--surface2);border:1px solid var(--border);border-radius:10px;margin-bottom:5px}
.rank-pos{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;min-width:28px;color:var(--muted)}
.rank-pos.gold{color:#ffd700}.rank-pos.silver{color:#b0bec5}.rank-pos.bronze{color:#ff8a65}
.rank-name{font-weight:700;font-size:13px;flex:1}
.rank-pts{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--yellow)}
.tab{display:flex;gap:3px;background:var(--surface2);padding:3px;border-radius:10px;margin-bottom:1rem;overflow-x:auto}
.tab-btn{padding:6px 12px;border-radius:7px;border:none;background:none;color:var(--muted);font-family:'Barlow',sans-serif;font-size:11px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.3px}
.tab-btn.active{background:var(--surface3);color:#fff}
.group-header{background:linear-gradient(90deg,var(--surface2),transparent);border-left:3px solid var(--yellow);padding:.35rem .8rem;border-radius:0 8px 8px 0;margin-bottom:.5rem}
.link-box{background:var(--surface3);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:11px;color:var(--yellow);word-break:break-all;cursor:pointer;transition:border .15s}
.link-box:hover{border-color:var(--yellow)}
.progress{height:4px;background:var(--surface3);border-radius:3px;overflow:hidden;margin-top:3px}
.progress-bar{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--green),var(--yellow));transition:width .5s}
.empty{text-align:center;padding:2.5rem 1rem;color:var(--muted)}
.empty-icon{font-size:2.5rem;margin-bottom:.5rem}
.alert{padding:.7rem 1rem;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:1rem}
.alert-info{background:#1e88e522;border:1px solid #1e88e544;color:#64b5f6}
.alert-success{background:#00d40022;border:1px solid #00d40044;color:var(--green)}
.alert-warn{background:#ffd70022;border:1px solid #ffd70044;color:var(--yellow)}
.alert-error{background:#ff3d5722;border:1px solid #ff3d5744;color:var(--red)}
.scrollable{max-height:500px;overflow-y:auto;padding-right:2px}
.scrollable::-webkit-scrollbar{width:3px}
.scrollable::-webkit-scrollbar-track{background:var(--surface2)}
.scrollable::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.spinner{display:inline-block;width:18px;height:18px;border:2px solid var(--border);border-top-color:var(--yellow);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.saving-bar{position:fixed;bottom:1rem;right:1rem;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.65rem 1rem;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;z-index:1000}
.config-grid{display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
.config-grid label{font-size:13px;color:var(--muted)}
.config-grid input{width:80px;text-align:center}
.hero{text-align:center;padding:2rem 0 1.5rem}
.hero-title{font-family:'Bebas Neue',sans-serif;font-size:4rem;letter-spacing:6px;line-height:.9;background:linear-gradient(135deg,var(--yellow) 0%,var(--green) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.hero-sub{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;letter-spacing:8px;color:var(--muted);margin-top:.25rem}
.hero-line{width:50px;height:3px;background:linear-gradient(90deg,var(--yellow),var(--green));margin:.75rem auto;border-radius:2px}
.hero-meta{color:var(--muted);font-size:13px}
.login-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:2rem;max-width:380px;margin:0 auto}
.login-logo{font-family:'Bebas Neue',sans-serif;font-size:2.5rem;letter-spacing:4px;background:linear-gradient(135deg,var(--yellow),var(--green));-webkit-background-clip:text;-webkit-text-fill-color:transparent;font-weight:900}
.login-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:1.5rem}
.chart-container{position:relative;background:var(--surface2);border-radius:10px;padding:1rem}
.chart-tooltip{position:absolute;background:#0d1220;border:1px solid var(--border);border-radius:8px;padding:.5rem .75rem;font-size:12px;pointer-events:none;z-index:50;box-shadow:0 4px 16px #0008}
.chart-tooltip.visible{display:block}
.reg-section{margin-bottom:1.5rem}
.reg-section h2{font-size:1rem;font-weight:700;color:#fff;margin-bottom:.75rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}
.reg-section h3{font-size:.85rem;font-weight:700;color:var(--yellow);margin:.75rem 0 .4rem;text-transform:uppercase;letter-spacing:.5px}
.reg-section p{font-size:13px;color:#c8d0e0;line-height:1.6;margin-bottom:.5rem}
.reg-table{width:100%;border-collapse:collapse;font-size:12px;margin:.5rem 0}
.reg-table th{color:var(--muted);font-weight:700;font-size:10px;letter-spacing:.5px;text-transform:uppercase;padding:6px 8px;text-align:left;border-bottom:1px solid var(--border)}
.reg-table td{padding:7px 8px;border-bottom:1px solid var(--surface2)}
.reg-table tr:last-child td{border-bottom:none}
.reg-list{list-style:none;padding:0}
.reg-list li{font-size:13px;color:#c8d0e0;padding:.3rem 0 .3rem 1rem;position:relative;line-height:1.5}
.reg-list li::before{content:'›';position:absolute;left:0;color:var(--yellow)}
.next-game-card{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;margin-bottom:6px}
.next-game-teams{font-weight:700;font-size:14px;color:#fff;margin-bottom:.4rem}
.next-game-picks{display:flex;flex-wrap:wrap;gap:6px;margin-top:.4rem}
.pick-chip{background:var(--surface3);border:1px solid var(--border);border-radius:6px;padding:3px 10px;font-size:12px;display:flex;align-items:center;gap:5px}
.pick-chip .pname{color:var(--muted);font-size:11px}
.pick-chip .pscore{color:var(--yellow);font-weight:700}
.pick-chip.no-pick{opacity:.5}
@media(max-width:640px){
  .grid2{grid-template-columns:1fr}
  .hero-title{font-size:2.2rem;letter-spacing:3px}
  .hero-sub{font-size:.8rem;letter-spacing:4px}
  .nav-btn{font-size:10px;padding:4px 7px}
  .content{padding:.75rem}
  .card{padding:.9rem}
  .card-dark{padding:.75rem}
  h1{font-size:1.5rem}
  .stat-val{font-size:1.6rem}
  .tab-btn{padding:5px 8px;font-size:10px}
  .login-card{padding:1.5rem}
  .login-logo{font-size:1.7rem}
  .pix-title{font-size:1.3rem}
}
@media(max-width:640px){
  .ranking-grid{grid-template-columns:28px 1fr 52px 52px 52px 70px !important;gap:3px !important}
  .ranking-row-pad{padding:.7rem .75rem !important}
  .ranking-name{font-size:12px !important}
  .ranking-pos{font-size:1.1rem !important}
  .ranking-score{font-size:13px !important}
  .ranking-total{font-size:1.2rem !important}
  .ranking-tarja{font-size:9px !important}
  .ranking-header{grid-template-columns:28px 1fr 52px 52px 52px 70px !important;gap:3px !important}
  .ranking-header-label{font-size:9px !important}
}
@media(max-width:380px){
  .nav-btn{font-size:9px;padding:3px 5px}
  .hero-title{font-size:1.8rem}
}
</style>
</head>

</html>
