<!DOCTYPE html>
<html>
<head>
  <title>Cadastro</title>
</head>
<body>

<h2>Cadastro</h2>

<input id="username" placeholder="Usuário"><br>
<input id="name" placeholder="Nome"><br>
<input id="password" type="password" placeholder="Senha"><br>
<input id="invite" placeholder="Código de convite"><br>
<button onclick="register()">Cadastrar</button>

<p id="msg"></p>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDI7D7XNv6caXOMJAGe1XsHYVR-eKNE4JM",
  authDomain: "bolao-copa-2026-b769c.firebaseapp.com",
  projectId: "bolao-copa-2026-b769c",
  storageBucket: "bolao-copa-2026-b769c.firebasestorage.app",
  messagingSenderId: "762920021590",
  appId: "1:762920021590:web:6c915f00ac76fbca58d5f7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.register = async function() {
  const username = document.getElementById("username").value;
  const name = document.getElementById("name").value;
  const password = document.getElementById("password").value;
  const inviteCode = document.getElementById("invite").value;

  try {
    // 🔐 validar convite
    const inviteRef = doc(db, "invites", inviteCode);
    const inviteSnap = await getDoc(inviteRef);

    if (!inviteSnap.exists()) {
      throw new Error("Convite inválido");
    }

    const data = inviteSnap.data();

    if (!data.active || data.uses >= data.maxUses) {
      throw new Error("Convite expirado");
    }

    // 🔐 criar usuário com email fake
    const email = username + "@bolao.com";

    const userCred = await createUserWithEmailAndPassword(auth, email, password);

    // salvar jogador
    await setDoc(doc(db, "players", userCred.user.uid), {
      username,
      name,
      createdAt: new Date()
    });

    // atualizar uso do convite
    await updateDoc(inviteRef, {
      uses: data.uses + 1
    });

    document.getElementById("msg").innerText = "✅ Cadastro feito!";
    
  } catch (e) {
    document.getElementById("msg").innerText = "❌ " + e.message;
  }
};
</script>

</body>
</html>
