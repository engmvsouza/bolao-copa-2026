version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: bolao
      POSTGRES_PASSWORD: bolao2026
      POSTGRES_DB: bolao_copa_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "3001:3001"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://bolao:bolao2026@postgres:5432/bolao_copa_2026
      JWT_SECRET: your_secret_key_here
      NODE_ENV: development

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
